<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custos</title>
    <script>
      // Applied before first paint so a stored light preference doesn't
      // flash dark for a frame while React boots. Kept in sync with
      // Shell.tsx's toggle, which owns the localStorage key going forward.
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
