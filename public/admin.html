  return section;
}

// -- Per-fallback-set runtime health --------------------------------------
//
// Surfaces the "live pick" for every configured fallback set plus the
// per-entry availability state. The per-provider panel above shows
// throttle depth; this panel shows the dispatch outcome — what an
// incoming request would actually hit — without the operator having to
// mentally traverse each chain. Refreshes on demand via the button;
// the boot-time fetch populates `state.fallbackSetHealth` from
// /admin/api/runtime/stats so a freshly-loaded admin panel can spot
// an exhausted chain before any user sees latency.
// -- Queue activity log --------------------------------------------------
//
// Surfaces the global queue's recent dispatch events so an operator can
// see, at a glance, what work is flowing through which provider — without
// having to trawl server logs. Each row is one event (queued / dispatched
// / fallback / succeeded / failed); a single logical request shows up as
// multiple rows in sequence, linked by requestId on the wire but
// recognisable in the table by identical project/agent/provider. The
// auto-poll fires every 5 seconds so a stalled chain is visible while the
// operator is staring at the page; the manual Refresh button forces an
// immediate re-fetch after a config change.
let queueActivityPollHandle = null;
function renderQueueActivityPanel() {
  const section = el("section", { class: "panel" });
  section.appendChild(el("h2", { text: "Queue activity" }));
  section.appendChild(el("p", { class: "desc", text: "Recent work dispatched through the global queue, oldest at the bottom. Rows tagged with the same project + agent came from one logical request; a request that walked the chain shows queued → dispatched → fallback → succeeded across multiple rows. Auto-refreshes every 5s." }));

  const body = el("div", { class: "panel-body" });
  const tbody = el("tbody");
  const table = el("table", { class: "activity-table" });
  table.appendChild(el("thead", {}, [el("tr", {}, [
    el("th", { text: "Time" }),
    el("th", { text: "Project" }),
    el("th", { text: "Agent" }),
    el("th", { text: "Role" }),
    el("th", { text: "Set" }),
    el("th", { text: "Provider" }),
    el("th", { text: "Model" }),
    el("th", { text: "Outcome" }),
    el("th", { text: "Duration" }),
  ])]));
  table.appendChild(tbody);
  body.appendChild(table);

  const statusLine = el("div", { class: "small", style: "margin-top: 6px;" });
  body.appendChild(statusLine);

  const refreshBtn = el("button", { style: "font-size: 11px; padding: 3px 8px;", text: "Refresh", onclick: async () => {
    refreshBtn.disabled = true;
    refreshBtn.textContent = "↻";
    try {
      await refreshQueueActivity();
    } finally {
      refreshBtn.disabled = false;
      refreshBtn.textContent = "Refresh";
    }
  }});
  const controls = el("div", { class: "row", style: "margin-top: 8px;" });
  controls.appendChild(refreshBtn);
  body.appendChild(controls);

  section.appendChild(body);

  async function refreshQueueActivity() {
    try {
      const resp = await api("/admin/api/queue/activity?limit=100");
      const events = resp.events || [];
      tbody.innerHTML = "";
      if (events.length === 0) {
        tbody.appendChild(el("tr", {}, [el("td", { colspan: "9", class: "muted", text: "No queue activity yet — dispatch an agent or trigger the chat to see events stream in." })]));
      } else {
        for (const ev of events) tbody.appendChild(renderQueueActivityRow(ev));
      }
      const cap = resp.capacity ?? events.length;
      statusLine.textContent = `Showing ${events.length} of last ${cap} events (newest first).`;
    } catch (err) {
      statusLine.textContent = `Failed to load: ${err.message}`;
    }
  }

  // Kick off the first fetch and start the 5s auto-poll. The poll
  // survives across renders via the closure on `tbody` and `statusLine`
  // — when render() runs again it replaces the DOM nodes, but the
  // previous interval keeps firing harmlessly (its writes land in
  // detached nodes that get GC'd). Clearing the handle on render()
  // exit avoids the leak entirely.
  refreshQueueActivity();
  if (queueActivityPollHandle) clearInterval(queueActivityPollHandle);
  queueActivityPollHandle = setInterval(() => { void refreshQueueActivity(); }, 5000);

  return section;
}

function renderQueueActivityRow(ev) {
  const time = new Date(ev.timestamp).toISOString().substr(11, 8);
  const outcomeLabel = {
    queued: "queued",
    dispatched: "→ dispatched",
    fallback: "↪ fallback",
    succeeded: "✓ succeeded",
    failed: "✕ failed",
  }[ev.outcome] || ev.outcome;
  const duration = ev.durationMs != null ? `${ev.durationMs}ms` : (ev.queuedAt != null ? `…${Date.now() - ev.queuedAt}ms` : "—");
  const tr = el("tr", { class: `outcome-${ev.outcome}` });
  tr.appendChild(el("td", { class: "time-cell", title: new Date(ev.timestamp).toISOString(), text: time }));
  tr.appendChild(el("td", { class: "project-cell", text: ev.projectName || ev.projectId || "—" }));
  tr.appendChild(el("td", {}, [
    el("span", { text: ev.agentName || ev.agentId || "—" }),
    ev.agentId && ev.agentName ? el("br") : null,
    ev.agentId && ev.agentName ? el("span", { class: "muted", style: "font-size: 10px;", text: ev.agentId }) : null,
  ].filter(Boolean)));
  tr.appendChild(el("td", { class: "muted", text: ev.role || "—" }));
  tr.appendChild(el("td", { class: "muted", text: ev.fallbackSet || "—" }));
  tr.appendChild(el("td", { class: "muted", text: ev.provider || "—" }));
  tr.appendChild(el("td", { class: "muted", text: ev.model || "—" }));
  const outcomeTd = el("td", { class: `outcome-cell outcome-${ev.outcome}`, text: outcomeLabel });
  if (ev.errorMessage) outcomeTd.title = ev.errorMessage;
  tr.appendChild(outcomeTd);
  tr.appendChild(el("td", { class: "duration-cell", text: duration }));
  return tr;
}

function renderFallbackSetHealthPanel() {
  const section = el("section", { class: "panel" });
  section.appendChild(el("h2", { text: "Fallback set health" }));
  section.appendChild(el("p", { class: "desc", text: "For each configured fallback set, the first available provider is the \"live pick\" — what an incoming request would dispatch to. A chain with no available entry is exhausted; requests pile up in the queue until a provider recovers." }));

  const health = state.fallbackSetHealth || {};
  const setNames = Object.keys(health);

  const refreshBtn = el("button", {
    style: "font-size: 11px; padding: 3px 8px;",
    text: "Refresh",
    onclick: async () => {
      refreshBtn.disabled = true;
      const original = refreshBtn.textContent;
      refreshBtn.textContent = "↻";
      try {
        const stats = await api("/admin/api/runtime/stats");
        state.fallbackSetHealth = stats.fallbackSets || {};
        state.fallbackSetHealthError = null;
        render();
      } catch (err) {
        // Mirror the boot path's contract: a failed refresh has to
        // surface in the panel, not just in a toast that disappears
        // after 3s. Otherwise a successful boot with N sets followed
        // by a 5xx refresh leaves the panel rendering the stale
        // healthy table (setNames.length > 0, so the empty-branch
        // warning never shows) — the operator sees stale data with
        // no indication the fetch failed. Clearing both fields
        // together matches what `loadState()` does on boot failure.
        state.fallbackSetHealth = {};
        state.fallbackSetHealthError = err.message || "stats endpoint unreachable";
        render();
        showToast(err.message, true);
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = original;
      }
    },
  });
  const header = el("div", { class: "row", style: "margin-bottom: 12px;" });
  header.appendChild(el("span", { class: "small", text: `${setNames.length} fallback set(s) configured.` }));
  header.appendChild(refreshBtn);
  section.appendChild(header);

  if (!setNames.length) {
    // Two distinct empty cases: "stats endpoint unreachable" vs
    // "no fallback sets configured". The former means an operator
    // would otherwise conclude the chain is healthy when the panel
    // is actually blind -- surface the failure explicitly so the
    // operator knows to click Refresh or check the server logs.
    if (state.fallbackSetHealthError) {
      const warn = el("div", {
        style: "padding: 10px 12px; border: 1px solid var(--danger); border-radius: 6px; background: rgba(217,112,91,0.08); margin-bottom: 12px;",
      });
      warn.appendChild(el("strong", { style: "color: var(--danger);", text: "Stats unavailable" }));
      warn.appendChild(el("div", { class: "small", style: "margin-top: 4px;", text: state.fallbackSetHealthError }));
      warn.appendChild(el("div", { class: "small", style: "margin-top: 4px;", text: "Click Refresh to retry. The panel is currently blind to chain health." }));
      section.appendChild(warn);
    } else {
      section.appendChild(el("p", { class: "small", text: "No fallback sets configured. Add one below under Fallback sets." }));
    }
    return section;
  }

  // Stable display order: alphabetical by name so operators can scan
  // a long list quickly.
  setNames.sort();
  const table = el("table", { style: "width: 100%; border-collapse: collapse; margin-bottom: 12px;" });
  table.appendChild(el("colgroup", {}, [
    el("col", { style: "width: 18%;" }),
    el("col", { style: "width: 30%;" }),
    el("col", { style: "width: 18%;" }),
    el("col", { style: "width: 34%;" }),
  ]));
  table.appendChild(el("tr", {}, [
    el("th", { text: "Set" }),
    el("th", { text: "Live pick" }),
    el("th", { text: "Chain length" }),
    el("th", { text: "Chain status" }),
  ]));

  for (const name of setNames) {
    const set = health[name];
    const livePick = set.livePick;
    const livePickCell = livePick
      ? el("td", {}, [
          el("strong", { text: `${livePick.provider}/${livePick.model}` }),
          el("br"),
          el("span", { class: "small", text: `entry [${livePick.index}] — would dispatch here` }),
        ])
      : el("td", {}, [
          el("span", { class: "badge warn", text: "EXHAUSTED" }),
          el("br"),
          el("span", { class: "small", text: set.chainLength === 0 ? "set is empty — no chain to walk" : "all entries currently unavailable" }),
        ]);
    const chainCell = el("td", {});
    if (set.entries.length === 0) {
      chainCell.appendChild(el("span", { class: "small", text: "—" }));
    } else {
      const row = el("div", { style: "display: flex; flex-wrap: wrap; gap: 4px; align-items: center;" });
      set.entries.forEach((entry, idx) => {
        const isLivePick = livePick && idx === livePick.index;
        const badge = renderEntryStatusBadge(entry);
        if (isLivePick) badge.style.boxShadow = "0 0 0 2px var(--accent)";
        row.appendChild(badge);
      });
      chainCell.appendChild(row);
    }
    table.appendChild(el("tr", {}, [
      el("td", {}, [
        el("strong", { text: name }),
        el("br"),
        el("span", { class: "small", text: set.description }),
      ]),
      livePickCell,
      el("td", { class: set.exhausted ? "muted" : "", text: String(set.chainLength) }),
      chainCell,
    ]));
  }
  section.appendChild(table);
  section.appendChild(el("p", { class: "small", style: "margin-top: 4px;", text: "Bordered entry = current live pick. Hover an entry for the full status detail." }));
  return section;
}

// Maps the runtime's per-entry `status` enum onto a colored badge with
// a hover-tooltip containing the specifics. Pulled out so the same
// vocabulary (color + suffix text) is used everywhere the chain is
// rendered -- not just the panel above, but any future surface
// (the agent card, the activity log, etc.) that wants to show
// "why isn't this entry being used".
function renderEntryStatusBadge(entry) {
  const labels = {
    available: { text: "available", cls: "ok", title: `Active: ${entry.active}${entry.maxConcurrent > 0 ? `/${entry.maxConcurrent}` : ""}${entry.queued > 0 ? ` (queued: ${entry.queued})` : ""}${entry.rpmLimit ? ` · RPM: ${entry.rpmTokens}/${entry.rpmLimit}` : ""}` },
    cooldown: { text: "cooldown", cls: "warn", title: entry.coolingUntil ? `Cooling until ${new Date(entry.coolingUntil).toISOString()}` : "Cooldown active" },
    "circuit-broken": { text: "breaker", cls: "warn", title: entry.breakerUntil ? `Circuit-broken until ${new Date(entry.breakerUntil).toISOString()}` : "Circuit breaker open" },
    "at-capacity": { text: "at-capacity", cls: "warn", title: `Active: ${entry.active}/${entry.maxConcurrent}${entry.queued > 0 ? ` · queued: ${entry.queued}` : ""}` },
    "rpm-exhausted": { text: "rpm-empty", cls: "warn", title: `RPM bucket empty (limit ${entry.rpmLimit}/min). Waiting for refill.` },
    unregistered: { text: "missing", cls: "off", title: "Provider not registered — config drift, the named provider may have been removed." },
  };
  const def = labels[entry.status] || { text: entry.status, cls: "off", title: "" };
  const badge = el("span", {
    class: `badge ${def.cls}`,
    style: "font-size: 10.5px; padding: 2px 7px;",
    text: `${entry.provider}/${entry.model}`,
    title: `${def.text} — ${def.title}`,
  });
  return badge;
}

// -- Fallback sets -------------------------------------------------------

/** Known provider keys (anthropic + configured providers) */
function listProviderKeys() {
  return ['anthropic', ...Object.keys(state.providers || {})];
}

/** Model names for a given provider key. */
function modelsForProvider(providerKey) {
  if (providerKey === 'anthropic') {
    return ['claude-opus-5', 'claude-sonnet-5', 'claude-haiku-4-5-20251001'];
  }
  const prov = state.providers?.[providerKey];
  if (!prov || !prov.models) return [];
  return prov.models.map(m => m.name);
}

/** Build a provider select element. */
function buildProviderSelect(selected, onchange) {
  const sel = el('select', { onchange });
  sel.appendChild(el('option', { value: '', text: '(choose provider)', disabled: true, selected: !selected ? 'selected' : undefined }));
  for (const key of listProviderKeys()) {
    const opt = el('option', { value: key, text: key });
    if (key === selected) opt.setAttribute('selected', 'selected');
    sel.appendChild(opt);
  }
  return sel;
}

/** Build a model select element for a given provider. */
function buildModelSelect(providerKey, selected) {
  const sel = el('select');
  const models = modelsForProvider(providerKey);
  if (!models.length) {
    sel.appendChild(el('option', { value: '', text: '(no models)', disabled: true }));
  } else {
    sel.appendChild(el('option', { value: '', text: '(choose model)', disabled: true, selected: !selected ? 'selected' : undefined }));
    for (const name of models) {
      const opt = el('option', { value: name, text: name });
      if (name === selected) opt.setAttribute('selected', 'selected');
      sel.appendChild(opt);
    }
  }
  return sel;
}

/** Create a single provider entry row (drag handle + provider select +
 *  model select + remove button). Returns the row element and a getter
 *  for reading its current { provider, model } value. */
function createProviderEntryRow(initialProvider, initialModel, onRemove, onMoveUp, onMoveDown, index) {
  const row = el('div', {
    draggable: 'true',
    style: 'display: flex; align-items: center; gap: 6px; margin-bottom: 6px; padding: 6px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;',
    class: 'fs-entry-row',
  });

  // Drag handle
  const handle = el('span', {
    style: 'cursor: grab; color: var(--muted); font-size: 16px; line-height: 1; user-select: none; flex-shrink: 0;',
    text: '⠿',
    title: 'Drag to reorder',
  });
  row.appendChild(handle);

  // Drag events
  row.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', '');
    row.classList.add('dragging');
    row.style.opacity = '0.5';
  });
  row.addEventListener('dragend', () => {
    row.classList.remove('dragging');
    row.style.opacity = '';
  });
  row.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const container = row.parentElement;
    if (!container) return;
    const dragEl = container.querySelector('.dragging');
    if (!dragEl || dragEl === row) return;
    const rect = row.getBoundingClientRect();
    const midY = rect.top + rect.height / 2;
    if (e.clientY < midY) {
      container.insertBefore(dragEl, row);
    } else {
      container.insertBefore(dragEl, row.nextSibling);
    }
  });
  row.addEventListener('drop', (e) => {
    e.preventDefault();
    // Re-index all rows after the drop.
    const container = row.parentElement;
    if (container) reindexRows(container);
  });

  // Provider select
  const providerSelect = buildProviderSelect(initialProvider, () => {
    // Rebuild model select when provider changes.
    const newProvider = providerSelect.value;
    const newModelSelect = buildModelSelect(newProvider, '');
    modelSelect.parentNode.replaceChild(newModelSelect, modelSelect);
    modelSelect = newModelSelect;
  });
  providerSelect.style.flex = '0 0 140px';
  row.appendChild(providerSelect);

  // Model select
  let modelSelect = buildModelSelect(initialProvider || 'anthropic', initialModel);
  modelSelect.style.flex = '0 0 180px';
  row.appendChild(modelSelect);

  // Up button
  const upBtn = el('button', {
    style: 'font-size: 11px; padding: 2px 6px; line-height: 1;',
    text: '▲',
    title: 'Move up',
    onclick: () => onMoveUp?.(row),
  });
  row.appendChild(upBtn);

  // Down button
  const downBtn = el('button', {
    style: 'font-size: 11px; padding: 2px 6px; line-height: 1;',
    text: '▼',
    title: 'Move down',
    onclick: () => onMoveDown?.(row),
  });
  row.appendChild(downBtn);

  // Remove button
  const removeBtn = el('button', {
    style: 'font-size: 14px; padding: 2px 8px; line-height: 1; color: var(--danger);',
    text: '×',
    title: 'Remove this provider',
    onclick: () => onRemove?.(row),
  });
  row.appendChild(removeBtn);

  // Getter for current values
  row._getValue = () => ({
    provider: providerSelect.value,
    model: modelSelect.value,
  });

  return row;
}

/** Re-index all entry rows in a container (updates move up/down button
 *  visibility). */
function reindexRows(container) {
  const rows = container.querySelectorAll('.fs-entry-row');
  rows.forEach((row, i) => {
    const btns = row.querySelectorAll('button');
    // Up button visibility
    if (btns.length >= 3) {
      btns[0].style.visibility = i === 0 ? 'hidden' : '';
      btns[1].style.visibility = i === rows.length - 1 ? 'hidden' : '';
    }
  });
}

function renderFallbackSetsPanel() {
  const section = el("section", { class: "panel" });
  section.appendChild(el("h2", { text: "Fallback sets" }));
  section.appendChild(el("p", { class: "desc", text: "Named groups of providers the Project Manager assigns to roles. A request with a fallback set tries each provider in order and falls through to the next if the current one is unavailable (cooldown, rate limit, concurrency cap)." }));

  const sets = state.fallbackSets || {};
  const keys = Object.keys(sets);
  if (keys.length === 0) {
    section.appendChild(el("p", { class: "small", text: "No fallback sets configured. The default config has 'complex', 'standard', and 'fast' sets." }));
  } else {
    const table = el("table", { style: "width: 100%; border-collapse: collapse;" });
    table.appendChild(el("colgroup", {}, [
      el("col", { style: "width: 18%;" }),
      el("col", { style: "width: 27%;" }),
      el("col", { style: "width: 45%;" }),
      el("col", { style: "width: 10%;" }),
    ]));
    table.appendChild(el("tr", {}, [
      el("th", { text: "Name" }),
      el("th", { text: "Description" }),
      el("th", { text: "Providers" }),
      el("th", { text: "Actions" }),
    ]));
    for (const [name, set] of Object.entries(sets)) {
      const providersStr = set.providers ? set.providers.map((p) => `${p.provider}/${p.model}`).join(" → ") : "—";
      const row = el("tr", {}, [
        el("td", { style: "font-weight: 600; font-size: 13px;", text: name }),
        el("td", { class: "small", text: set.description || "" }),
        el("td", { class: "small", style: "font-family: monospace; font-size: 11px;", text: providersStr }),
        el("td", { class: "actions-cell" }, [
          el("button", { class: "row-btn", text: "Edit", onclick: () => enterFallbackSetEditRow(name, set) }),
          el("button", { class: "row-btn danger", text: "Delete", onclick: () => reloadAfter(
            api(`/admin/api/fallback-sets/${encodeURIComponent(name)}`, { method: "DELETE" }), `Removed "${name}"`
          )}),
        ]),
      ]);
      table.appendChild(row);
    }
    section.appendChild(table);
  }

  // --- Add/edit form ---
  section.appendChild(el("hr", { class: "sep" }));
  section.appendChild(el("p", { class: "small", text: "Add or update a fallback set" }));

  const setNameInput = el("input", { type: "text", placeholder: "key (e.g. complex)", class: "fs-set-name", style: "max-width: 300px;" });
  const descInput = el("input", { type: "text", placeholder: "Description shown to the Project Manager", class: "fs-desc", style: "flex: 1;" });
  section.appendChild(el("div", { class: "row" }, [setNameInput, descInput]));

  // Provider entries container
  const entriesContainer = el("div", {
    style: "margin: 10px 0; min-height: 40px;",
    class: "fs-entries",
  });

  // Add entry button
  const addEntryBtn = el("button", {
    text: "+ Add provider",
    style: "font-size: 12px;",
    onclick: () => {
      const entry = createProviderEntryRow(
        '', '',
        (row) => { row.remove(); reindexRows(entriesContainer); },
        (row) => {
          const prev = row.previousElementSibling;
          if (prev && prev.classList.contains('fs-entry-row')) {
            entriesContainer.insertBefore(row, prev);
            reindexRows(entriesContainer);
          }
        },
        (row) => {
          const next = row.nextElementSibling;
          if (next && next.classList.contains('fs-entry-row')) {
            entriesContainer.insertBefore(next, row);
            reindexRows(entriesContainer);
          }
        },
        entriesContainer.querySelectorAll('.fs-entry-row').length
      );
      entriesContainer.appendChild(entry);
      reindexRows(entriesContainer);
    },
  });

  section.appendChild(entriesContainer);
  section.appendChild(el("div", { class: "row" }, [addEntryBtn]));

  // Save button
  section.appendChild(el("div", { class: "row", style: "margin-top: 8px;" }, [
    el("button", { class: "primary", text: "Save", onclick: () => {
      const name = setNameInput.value.trim();
      const desc = descInput.value.trim();
      const rows = entriesContainer.querySelectorAll('.fs-entry-row');
      if (!name) return showToast("Enter a set key", true);
      if (!rows.length) return showToast("Add at least one provider", true);
      const providers = [];
      for (const row of rows) {
        const val = row._getValue();
        if (!val.provider || !val.model) return showToast("Every provider entry needs a provider and model selected", true);
        providers.push(val);
      }
      reloadAfter(api(`/admin/api/fallback-sets/${encodeURIComponent(name)}`, {
        method: "PUT",
        body: { description: desc, providers },
      }), "Fallback set saved");
    }}),
  ]));

  return section;
}

// Opens the add/edit form with pre-filled values for an existing fallback set.
function enterFallbackSetEditRow(name, set) {
  // Fill name and description.
  const setNameInput = document.querySelector('.fs-set-name');
  const descInput = document.querySelector('.fs-desc');
  if (setNameInput && descInput) {
    setNameInput.value = name;
    descInput.value = set.description || '';
    setNameInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // Rebuild provider entries.
  const container = document.querySelector('.fs-entries');
  if (container) {
    container.innerHTML = '';
    for (const entry of (set.providers || [])) {
      const row = createProviderEntryRow(
        entry.provider, entry.model,
        (r) => { r.remove(); reindexRows(container); },
        (r) => {
          const prev = r.previousElementSibling;
          if (prev && prev.classList.contains('fs-entry-row')) {
            container.insertBefore(r, prev);
            reindexRows(container);
          }
        },
        (r) => {
          const next = r.nextElementSibling;
          if (next && next.classList.contains('fs-entry-row')) {
            container.insertBefore(next, r);
            reindexRows(container);
          }
        },
        Array.from(container.querySelectorAll('.fs-entry-row')).length
      );
      container.appendChild(row);
    }
    reindexRows(container);
  }
}

function labelForRole(systemRole) {
  switch (systemRole) {
    case "memoryCurator": return "Memory curator";
    case "permissionClassifier": return "Permission classifier";
    case "embeddings": return "Embeddings";
    default: return systemRole || "(unknown)";
  }
}

// -- Projects / remote control ----------------------------------------

function renderProjectsPanel() {
  const section = el("section", { class: "panel" });
  section.appendChild(el("h2", { text: "Projects" }));
  section.appendChild(el("p", { class: "desc", text: "Each project is a workspace folder. A chat is a connectable session for that workspace -- open it from your phone, another computer, or the Custos desktop app to stream turns against the project's folder. The connect link is a bearer credential: anyone with it can type into that session. Don't share it, and don't expose this port past a network you trust." }));

  // New project button + Migrate now button
  section.appendChild(el("div", { class: "row" }, [
    el("button", { class: "primary", text: "New project", onclick: async () => {
      const name = prompt("Project name:");
      if (!name || !name.trim()) return;
      reloadAfter(api("/admin/api/projects", { method: "POST", body: { name: name.trim() } }), "Project created");
    }}),
    el("button", { text: "Migrate now", title: "Apply fallback-set defaults to any agents that still use direct model assignments; safe to call anytime, only touches agents without a fallbackSet", onclick: async () => {
      try {
        const result = await api("/admin/api/projects/migrate-fallback-sets", { method: "POST" });
        if (result.migrated > 0) {
          showToast(`Migrated ${result.migrated} agent(s) to fallback-set defaults — PM will re-evaluate on next tick`);
        } else {
          showToast("All agents already have a fallback set — nothing to migrate");
        }
        await loadState();
      } catch (err) {
        showToast(err.message, true);
      }
    }}),
  ]));

  const projects = state.projects || [];
  if (projects.length === 0) {
    section.appendChild(el("p", { class: "small", text: "No projects yet." }));
  } else {
    const table = el("table", { style: "table-layout: fixed;" });
    const colgroup = el("colgroup", {}, [
      el("col", { style: "width: 28%;" }),
      el("col", { style: "width: 26%;" }),
      el("col", { style: "width: 46%;" }),
    ]);
    table.appendChild(colgroup);

    // Compact header
    const thead = el("thead", {});
    thead.appendChild(el("tr", {}, [
      el("th", { text: "Project" }),
      el("th", { text: "Budget" }),
      el("th", { text: "Agents · Controls" }),
    ]));
    table.appendChild(thead);

    const tbody = el("tbody", {});

    for (const project of projects) {
      const tr = el("tr", {});
      const id = project.id;

      // --- Column 1: Name + workspace + chat toggle ---
      const nameCell = el("td", { style: "vertical-align: top;" });
      nameCell.appendChild(el("strong", { text: project.name }));
      nameCell.appendChild(el("br"));
      nameCell.appendChild(el("span", { class: "small", text: project.workspaceDir }));

      // Lazy-load toggle: fetches chats on first click, toggles detail row after.
      const chatToggle = el("span", {
        class: "small",
        style: "cursor: pointer; color: var(--accent); margin-left: 4px;",
        text: `► Chats`,
        onclick: async (ev) => {
          ev.stopPropagation();
          let detailRow = tr.nextElementSibling;
          if (!detailRow || !detailRow.classList.contains("chat-detail")) {
            // First click — fetch chats and build the detail row.
            chatToggle.textContent = "► Loading…";
            let chats;
            try {
              const resp = await api(`/admin/api/projects/${project.id}/chats`);
              chats = resp.chats || [];
            } catch {
              chats = [];
            }
            detailRow = el("tr", { class: "chat-detail" });
            const detailTd = el("td", { colspan: "3", style: "padding: 0; border: none;" });
            const chatWrap = el("div", { style: "margin: 0 0 8px 0; display: flex; flex-direction: column; gap: 4px;" });
            for (const chat of chats) {
              chatWrap.appendChild(renderChat(chat));
            }
            detailTd.appendChild(chatWrap);
            detailRow.appendChild(detailTd);
            tr.parentNode.insertBefore(detailRow, tr.nextSibling);
          }
          const hidden = detailRow.style.display === "none";
          detailRow.style.display = hidden ? "" : "none";
          chatToggle.textContent = hidden ? "▲ Chats" : "► Chats";
        },
      });
      nameCell.appendChild(chatToggle);
      tr.appendChild(nameCell);

      // --- Column 2: Budget bar (compact inline) ---
      const budgetCell = el("td", { style: "vertical-align: middle;" });
      const budget = project.budget;
      if (budget && budget.monthlyUsd != null) {
        const limit = budget.monthlyUsd;
        const spent = project.spentUsd ?? 0;
        const pct = Math.min(100, Math.round((spent / limit) * 100));
        let cls = "ok";
        if (pct >= 90) cls = "danger";
        else if (pct >= 70) cls = "warn";
        const now = new Date();
        const resetDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 1));
        const resetStr = resetDate.toLocaleDateString(undefined, { month: "short", day: "numeric" });

        budgetCell.appendChild(el("div", { style: "display: flex; align-items: center; gap: 6px;" }, [
          el("span", { class: "budget-label", text: `$${spent.toFixed(0)}` }),
          el("div", { style: "flex: 1; background: var(--bg); border-radius: 999px; height: 6px; overflow: hidden; min-width: 60px;" }, [
            el("div", { class: `budget-bar-fill ${cls}`, style: `width: ${Math.max(2, pct)}%; height: 100%; border-radius: 999px;` }),
          ]),
          el("span", { class: "budget-label", text: `$${limit.toFixed(0)}` }),
          el("span", { class: "small", text: `↻${resetStr}` }),
        ]));
      } else {
        budgetCell.appendChild(el("span", { class: "small", text: "—" }));
      }
      tr.appendChild(budgetCell);

      // --- Column 3: Agent badges + action buttons ---
      const controlsCell = el("td", { style: "vertical-align: middle;" });

      // Agent roster (compact inline badges)
      const roster = project.agents || [];
      const roleLabels = { "product-owner": "PO", "engineering-manager": "EM", engineer: "Eng", qa: "QA", devops: "DevOps" };
      const roleOrder = ["product-owner", "engineering-manager", "engineer", "qa", "devops"];
      const byRole = new Map(roster.filter((a) => roleOrder.includes(a.role)).map((a) => [a.role, a]));
      const shown = roleOrder.map((r) => byRole.get(r)).filter(Boolean);

      if (shown.length || project.pmLastRunAt) {
        const badgesRow = el("div", { style: "display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 6px; align-items: center;" });
        for (const agent of shown) {
          // Compact badge: fallback set is the headline when assigned (the
          // runtime dispatches through `custos:fallback/<set-name>` when
          // fallbackSet is set, so the legacy providerKey/model is just
          // a "primary pick" hint for the human reading this card -- not
          // what the runtime actually uses). When no fallbackSet is set
          // we fall back to providerKey/model so the card still has a
          // informative label.
          // Tooltip carries the full providerKey/model, the fallback set
          // name (or a "no fallback set" note), the specialty, and the
          // QA stats so the operator can dig in without leaving the page.
          const tooltipLines = [`Provider/model: ${agent.providerKey}/${agent.model}`];
          if (agent.fallbackSet) {
            tooltipLines.push(`Fallback set: ${agent.fallbackSet} (runtime uses this for per-request failover)`);
          } else {
            tooltipLines.push("Fallback set: none (legacy pinned model)");
          }
          if (agent.specialty) tooltipLines.push(`Specialty: ${agent.specialty}`);
          const { assigned, completed, qaRejections } = agent.stats || {};
          const statsParts = [];
          if (assigned != null) statsParts.push(`Assigned: ${assigned}`);
          if (completed != null) statsParts.push(`Done: ${completed}`);
          if (qaRejections != null) statsParts.push(`QA ✘: ${qaRejections}`);
          if (statsParts.length) tooltipLines.push(statsParts.join(" | "));
          if (agent.notes?.length) {
            const lastNote = agent.notes[agent.notes.length - 1];
            tooltipLines.push(`Last note: ${lastNote.length > 80 ? lastNote.slice(0, 80) + "..." : lastNote}`);
          }
          // Headline: fallback set when set, otherwise the legacy model.
          // The ":" separator matches the previous style so a row of mixed
          // agents (some with fallbackSets, some without) still reads as
          // [role]: [what lives at that role].
          const label = agent.fallbackSet
            ? `${roleLabels[agent.role]}: ${agent.fallbackSet}`
            : `${roleLabels[agent.role]}:${agent.model.includes("/") ? agent.model.split("/").pop() : agent.model}`;
          badgesRow.appendChild(el("span", {
            class: `badge ${agent.role === "engineer" ? "warn" : "ok"}`,
            style: "font-size: 10px; padding: 1px 5px; cursor: help;",
            title: tooltipLines.join("\n"),
            text: label,
          }));
        }
      if (project.pmLastRunAt) {
        const pmDate = new Date(project.pmLastRunAt);
        // The footer label is the operator-facing hint: "Last PM run: <date>"
        // is the discoverable thing the original anonymous timestamp
        // wasn't. The status hint after the date says whether to expect
        // the PM to do anything more without intervention -- when
        // pmConfigured is true the assignments are stable until the
        // operator resets, and after a Reset the next tick will overwrite
        // both the assignments and pmLastRunAt. The two states are
        // legitimately different enough that hiding one as the other's
        // tooltip would be misleading.
        const stamp = `${pmDate.toLocaleDateString()} ${pmDate.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
        const hint = project.pmConfigured
          ? " — assignments are stable until you click Reset PM"
          : " — will re-run on next tick";
        badgesRow.appendChild(el("span", { class: "small", style: "font-size: 10px;", title: "Last PM run" + hint, text: `Last PM run: ${stamp}${hint}` }));
      }
        controlsCell.appendChild(badgesRow);
      }

      // Action buttons row
      const actions = el("div", { style: "display: flex; flex-wrap: wrap; gap: 4px; align-items: center;" });
      actions.appendChild(el("button", { style: "font-size: 11px; padding: 3px 8px;", text: "Chat", onclick: () => reloadAfter(
        api(`/admin/api/projects/${project.id}/chats`, { method: "POST", body: {} }), "Chat started"
      )}));
      actions.appendChild(el("button", { style: "font-size: 11px; padding: 3px 8px;", text: "Rename", onclick: () => {
        const name = prompt("Project name:", project.name);
        if (!name || !name.trim() || name.trim() === project.name) return;
        reloadAfter(api(`/admin/api/projects/${project.id}`, { method: "PATCH", body: { name: name.trim() } }), "Renamed");
      }}));
      if (project.paused) {
        actions.appendChild(el("button", { class: "primary", style: "font-size: 11px; padding: 3px 8px;", text: "Resume", onclick: () => reloadAfter(
          api(`/admin/api/projects/${project.id}/resume`, { method: "POST" }), "Project resumed"
        )}));
      } else {
        actions.appendChild(el("button", { style: "font-size: 11px; padding: 3px 8px;", text: "Pause", onclick: () => reloadAfter(
          api(`/admin/api/projects/${project.id}/pause`, { method: "POST" }), "Project paused"
        )}));
      }
      actions.appendChild(el("button", { style: "font-size: 11px; padding: 3px 8px;", text: "Reset PM", title: "Flip pmConfigured to false so the Project Manager re-evaluates on the next tick; doesn't run the PM now", onclick: () => reloadAfter(
        api(`/admin/api/projects/${project.id}/reset-pm`, { method: "POST" }), "PM reset — will re-run on next tick"
      )}));
      actions.appendChild(el("button", { style: "font-size: 11px; padding: 3px 8px;", text: "Re-assign", title: "Force the Project Manager to run now and overwrite current assignments", onclick: () => reloadAfter(
        api(`/admin/api/projects/${project.id}/reassign-models`, { method: "POST" }), "Project Manager re-assigning models"
      )}));
      actions.appendChild(el("button", { class: "danger", style: "font-size: 11px; padding: 3px 8px;", text: "Delete", onclick: () => {
        if (!confirm(`Delete "${project.name}"? This stops and removes all its chats -- the workspace folder and its files are left untouched.`)) return;
        reloadAfter(api(`/admin/api/projects/${project.id}`, { method: "DELETE" }), "Project deleted");
      }}));
      controlsCell.appendChild(actions);

      tr.appendChild(controlsCell);
      tbody.appendChild(tr);

    }

    table.appendChild(tbody);
    section.appendChild(table);
  }

  return section;
}

function renderChat(chat) {
  const row = el("div", { style: "display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;" });
  row.appendChild(el("span", { style: "font-size: 12px; min-width: 80px;", text: chat.title }));
  row.appendChild(el("span", { class: `badge ${chat.active ? "ok" : "off"}`, style: "font-size: 10px; padding: 1px 6px;", text: chat.active ? `Active` : "Stopped" }));

  if (chat.active) {
    const urlInput = el("input", { type: "text", style: "flex: 1; font-size: 11px; padding: 3px 6px; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 4px;", value: chat.connectUrl, readonly: "readonly" });
    row.appendChild(urlInput);
    row.appendChild(el("button", { style: "font-size: 11px; padding: 2px 6px;", text: "Copy", onclick: () => { navigator.clipboard.writeText(chat.connectUrl); showToast("Copied"); } }));
    row.appendChild(el("button", { style: "font-size: 11px; padding: 2px 6px;", text: "Open", onclick: () => window.open(chat.connectUrl, "_blank") }));
    row.appendChild(el("button", { style: "font-size: 11px; padding: 2px 6px; color: var(--danger);", text: "Stop", onclick: () => reloadAfter(
      api(`/admin/api/chats/${chat.id}/stop`, { method: "POST" }), "Chat stopped"
    )}));
  } else {
    row.appendChild(el("button", { class: "primary", style: "font-size: 11px; padding: 2px 6px;", text: "Reopen", onclick: () => reloadAfter(
      api(`/admin/api/chats/${chat.id}/reopen`, { method: "POST" }), "Chat reopened"
    )}));
    row.appendChild(el("button", { style: "font-size: 11px; padding: 2px 6px; color: var(--danger);", text: "Delete", onclick: () => {
      if (!confirm(`Delete chat "${chat.title}"?`)) return;
      reloadAfter(api(`/admin/api/chats/${chat.id}`, { method: "DELETE" }), "Chat deleted");
    }}));
  }
  return row;
}

// -- Security --------------------------------------------------

function renderSecurityPanel() {
  const section = el("section", { class: "panel" });
  section.appendChild(el("h2", { text: "Security" }));
  section.appendChild(el("p", { class: "desc", text: "Change the admin password used to sign in here and access remote control." }));

  const current = el("input", { type: "password", placeholder: "Current password" });
  const next = el("input", { type: "password", placeholder: "New password (min 8 chars)" });
  section.appendChild(el("div", { class: "row" }, [current, next, el("button", { class: "primary", text: "Change password", onclick: () => {
    if (!current.value || !next.value) return showToast("Fill in both fields", true);
    reloadAfter(api("/admin/api/change-password", { method: "POST", body: { currentPassword: current.value, newPassword: next.value } }), "Password changed");
  }})]));

  return section;
}

loadState().catch((err) => {
  $("#app").innerHTML = "";
  $("#app").appendChild(el("section", { class: "panel" }, [el("p", { text: "Failed to load: " + err.message })]));
});
