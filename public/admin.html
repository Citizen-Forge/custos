<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Custos Admin</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1c1f26;
    --border: #2b2f38;
    --text: #e4e6eb;
    --muted: #8b93a1;
    --accent: #5b9dd9;
    --danger: #d9705b;
    --ok: #5bd98f;
    --warn: #d9c15b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  header button { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; }
  header button:hover { color: var(--text); border-color: var(--muted); }
  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 24px 28px 80px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  section.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
  }
  section.panel h2 { margin: 0 0 4px; font-size: 15px; }
  section.panel .desc { color: var(--muted); font-size: 12.5px; margin: 0 0 16px; }
  /* Collapsible panel toggle. Default to collapsed so the settings
     page isn't a wall of tables on first load; operators expand the
     panels they want to inspect. Persisted per panel in localStorage
     so the operator's preferred working set survives reloads. */
  section.panel .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
    gap: 12px;
  }
  section.panel .panel-header:hover h2 { color: var(--accent); }
  section.panel .panel-toggle {
    color: var(--muted);
    font-size: 12px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    flex-shrink: 0;
    transition: transform 0.15s;
  }
  section.panel .panel-toggle:hover { color: var(--text); }
  section.panel.collapsed .panel-body { display: none; }
  section.panel.collapsed .panel-toggle { transform: rotate(-90deg); }
  /* Activity log table sits tighter than the per-provider tables
     because there are many rows and the operator scans them. */
  .activity-table { font-size: 12px; }
  .activity-table td, .activity-table th { padding: 4px 6px; vertical-align: top; }
  .activity-table td.outcome-cell { white-space: nowrap; }
  .activity-table td.time-cell { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
  .activity-table td.duration-cell { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
  .activity-table td.project-cell { font-weight: 600; }
  .activity-table td.muted { color: var(--muted); }
  .activity-table .outcome-dispatched { color: var(--accent); }
  .activity-table .outcome-succeeded { color: var(--ok); }
  .activity-table .outcome-failed { color: var(--danger); }
  .activity-table .outcome-fallback { color: var(--warn); }
  .activity-table .outcome-queued { color: var(--muted); }
  .activity-table tr.outcome-failed td { background: rgba(217,112,91,0.04); }
  .activity-table .err-msg { color: var(--danger); font-size: 11px; display: block; max-width: 320px; word-break: break-word; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  label { color: var(--muted); font-size: 12.5px; min-width: 70px; }
  input[type=text], input[type=password], input[type=number], select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 9px;
    font-size: 13px;
    font-family: inherit;
  }
  input[type=text], input[type=password], input[type=number] { flex: 1; min-width: 160px; }
  /* Tighter layout when a number sits inline with a small label and a
     helper-text span on the same row -- the default `flex: 1` would
     stretch it across the full panel width and crowd out the helper. */
  .row input[type=number] { flex: 0 0 110px; min-width: 0; }
  button {
    background: #262a33;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 13px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #2f3440; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.ok { background: rgba(91,217,143,0.15); color: var(--ok); }
  .badge.warn { background: rgba(217,193,91,0.15); color: var(--warn); }
  .badge.off { background: rgba(139,147,161,0.15); color: var(--muted); }
  table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .providers-table { table-layout: fixed; border-spacing: 0; }
  .providers-table td, .providers-table th { vertical-align: middle; }
  .providers-table .actions-cell { white-space: nowrap; text-align: right; padding-right: 12px; }
  .providers-table .row-btn { font-size: 11px; padding: 3px 7px; margin-left: 3px; }
  .providers-table .row-btn:first-child { margin-left: 0; }
  .providers-table .row-btn.danger { color: var(--danger); }
  .providers-table .cost-chip {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .providers-table .cost-chip.free { background: rgba(91,217,143,0.15); color: var(--ok); }
  .providers-table .cost-chip.subscription { background: rgba(91,193,219,0.15); color: var(--accent); }
  .providers-table .cost-chip.metered { background: rgba(217,193,91,0.15); color: var(--warn); }
  .providers-table .url-cell { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; word-break: break-all; }
  .providers-table .muted { color: var(--muted); }
  .providers-table .provider-name-cell { cursor: pointer; user-select: none; }
  .providers-table .provider-name-cell > strong { pointer-events: none; }
  .providers-table .provider-toggle { color: var(--muted); font-size: 10px; flex-shrink: 0; width: 10px; display: inline-block; margin-right: 6px; }
  .providers-table .model-detail td { padding: 5px 12px 5px 36px; font-size: 12px; background: rgba(255,255,255,0.025); border-bottom: 1px solid rgba(255,255,255,0.04); }
  .providers-table .separator td { padding: 0; border-bottom: 1px solid var(--border); height: 6px; }
  .task-block { margin-bottom: 18px; }
  .task-block h3 { font-size: 13px; margin: 0 0 8px; color: var(--text); }
  pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    overflow-x: auto;
    font-size: 12.5px;
    margin: 0 0 8px;
  }
  .copy-row { display: flex; justify-content: flex-end; margin-top: -4px; margin-bottom: 12px; }
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.15s, transform 0.15s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .budget-bar {
    background: var(--bg);
    border-radius: 999px;
    height: 8px;
    overflow: hidden;
    margin: 4px 0;
    flex: 1;
    min-width: 120px;
  }
  .budget-bar-fill {
    height: 100%;
    border-radius: 999px;
    transition: width 0.3s ease;
  }
  .budget-bar-fill.ok { background: var(--ok); }
  .budget-bar-fill.warn { background: var(--warn); }
  .budget-bar-fill.danger { background: var(--danger); }
  .budget-label { font-variant-numeric: tabular-nums; font-size: 12.5px; white-space: nowrap; }
  hr.sep { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .small { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Custos</h1>
    <p>Providers, projects, and agent orchestration</p>
  </div>
  <div style="display: flex; align-items: center; gap: 10px;">
    <span id="commit-hash" class="small" style="font-size: 11px; font-family: monospace;"></span>
    <button onclick="fetch('/logout', {method: 'POST'}).then(() => location.href = '/login')">Log out</button>
  </div>
</header>
<main id="app">
  <section class="panel"><p class="small">Loading…</p></section>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (sel, el = document) => el.querySelector(sel);
const el = (tag, attrs = {}, children = []) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) if (c) node.appendChild(c);
  return node;
};

let state = null;

function showToast(message, isError = false) {
  const t = $("#toast");
  t.textContent = message;
  t.className = "toast show" + (isError ? " error" : "");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => { t.className = "toast"; }, 3000);
}

// Renders a set of model checkboxes inside `container`. `models` is an
// array of { id, owned_by?, created? } from the probe endpoint. `enabledSet`
// is a Set of model names that should be pre-checked. Each model gets a
// checkbox + label. New models (not in enabledSet) start unchecked.
// The checkboxes are stored on `container.checkboxes` as a Map<name, input>.
function renderModelCheckboxes(container, models, enabledSet) {
  container.innerHTML = "";
  container.checkboxes = new Map();
  if (!models || !models.length) {
    container.appendChild(el("div", { class: "small", text: "No models found. Enter model names manually or scan again." }));
    return;
  }
  const grid = el("div", { style: "display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0;" });
  for (const model of models) {
    const id = model.id || model;
    const checked = enabledSet.has(id);
    const label = el("label", {
      style: "display: inline-flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer;",
    });
    const cb = el("input", { type: "checkbox", checked: checked ? "checked" : undefined });
    label.appendChild(cb);
    label.appendChild(el("span", { text: id }));
    container.checkboxes.set(id, cb);
    grid.appendChild(label);
  }
  container.appendChild(grid);
}

// Reads a throttle input element. Returns:
//   - undefined when the value is invalid (toast already shown) -- caller should bail
//   - null when the field is blank (== "unlimited", wire-serialized as null)
//   - a positive integer otherwise (== "throttle on, capped at N")
// `null` on the wire maps to an omitted `maxConcurrent` on config.json, so an
// unlimited instance round-trips cleanly through saveConfig -> loadConfig.
function formatBytes(n) {
  if (n == null) return "—";
  if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(n % (1024 * 1024) === 0 ? 0 : 1) + " MB";
  if (n >= 1024) return (n / 1024).toFixed(n % 1024 === 0 ? 0 : 1) + " KB";
  return n + " B";
}

function parseThrottle(input) {
  const raw = input.value.trim();
  const value = raw ? Number(raw) : null;
  if (value !== null && (!Number.isInteger(value) || value < 1)) {
    showToast("Max concurrent must be a positive integer (or blank for unlimited)", true);
    return undefined;
  }
  return value;
}

// Reads model checkboxes from a container rendered by renderModelCheckboxes.
// Returns an array of { name, enabled } objects for the provider PUT body.
function readModelCheckboxes(container, pricing) {
  if (!container.checkboxes || container.checkboxes.size === 0) return [];
  const models = [];
  let first = true;
  for (const [name, cb] of container.checkboxes) {
    models.push({
      name,
      enabled: cb.checked,
      ...(first && pricing ? { pricing } : {}),
    });
    first = false;
  }
  return models;
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "content-type": "application/json", ...(opts.headers || {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) {
    location.href = "/login?next=" + encodeURIComponent(location.pathname);
    return new Promise(() => {}); // never resolves -- we're navigating away
  }
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
  return json;
}

async function loadState() {
  state = await api("/admin/api/state");
  // Fetch version (commit hash) and display in header.
  api("/admin/api/version").then((v) => {
    const el = document.getElementById("commit-hash");
    if (el && v.commit) {
      el.textContent = v.commit;
      el.title = `Deployed commit: ${v.commit}`;
    }
  }).catch(() => {/* version endpoint is informational only */});
  // Global services (memory curator, permission classifier, embeddings)
  // share their own panel. Pre-load so render() can show them without
  // a follow-up fetch.
  try {
    state.globalAgents = (await api("/admin/api/global-agents")).agents || [];
  } catch {
    state.globalAgents = [];
  }
  state.projects = (await api("/admin/api/projects")).projects;
  for (const project of state.projects) {
    // Chats are lazy-loaded on first click of the chat toggle — no pre-fetch.
    project.chats = null;
    // Fetch per-project settings which include budget + spend data AND agent roster.
    const settingsResp = await api(`/admin/api/projects/${project.id}/settings`);
    project.budget = settingsResp.settings.budget;
    project.spentUsd = settingsResp.spentUsd ?? 0;
    project.subscriptionUsd = settingsResp.subscriptionUsd ?? 0;
    project.agents = settingsResp.agents ?? [];
    project.pmLastRunAt = settingsResp.settings.pmLastRunAt ?? null;
    project.pmConfigured = settingsResp.settings.pmConfigured ?? false;
    project.paused = settingsResp.settings.paused ?? false;
  }
  // Per-fallback-set health snapshot. Refreshed on demand via the
  // panel's "Refresh" button; the boot-time fetch gives operators
  // an immediate signal whether any chain is currently exhausted.
  // The panel distinguishes "no fallback sets configured" from
  // "stats endpoint unreachable" so a 5xx on /admin/api/runtime/stats
  // doesn't read as a healthy chain to the operator.
  try {
    const stats = await api("/admin/api/runtime/stats");
    state.fallbackSetHealth = stats.fallbackSets || {};
    state.fallbackSetHealthError = null;
  } catch (err) {
    state.fallbackSetHealth = {};
    state.fallbackSetHealthError = err.message || "stats endpoint unreachable";
  }
  render();
}

async function reloadAfter(promise, successMessage) {
  try {
    await promise;
    showToast(successMessage);
    await loadState();
  } catch (err) {
    showToast(err.message, true);
  }
}

function render() {
  const app = $("#app");
  app.innerHTML = "";
  app.appendChild(makeCollapsible(renderProvidersPanel(), "providers"));
  app.appendChild(makeCollapsible(renderGlobalServicesPanel(state.providers), "global-services"));
  app.appendChild(makeCollapsible(renderFallbackSetHealthPanel(), "fallback-set-health"));
  app.appendChild(makeCollapsible(renderQueueActivityPanel(), "queue-activity"));
  app.appendChild(makeCollapsible(renderFallbackSetsPanel(), "fallback-sets"));
  app.appendChild(makeCollapsible(renderProjectsPanel(), "projects"));
  app.appendChild(makeCollapsible(renderSecurityPanel(), "security"));
}

// Wrap a panel so the header is a click toggle that hides the body.
// State is persisted per panel id in localStorage; default is collapsed
// so a fresh visit doesn't show every table at once. The header
// retains the original <h2> (and any leading <p class="desc"> the panel
// put there) so the section's identity is unchanged when expanded.
function makeCollapsible(panel, panelId) {
  if (!panel || !panel.querySelector) return panel;
  const h2 = panel.querySelector("h2");
  if (!h2) return panel;
  // Wrap every child except h2 in a single panel-body div so we can
  // hide them with one CSS rule. We deliberately re-use the existing
  // header-level elements (h2 + .desc) -- they're the panel's identity
  // and belong outside the toggle.
  const headerKids = [h2];
  const desc = panel.querySelector("p.desc");
  if (desc && desc.parentNode === panel) headerKids.push(desc);
  const body = el("div", { class: "panel-body" });
  for (const child of Array.from(panel.children)) {
    if (headerKids.includes(child)) continue;
    body.appendChild(child);
  }
  const header = el("div", { class: "panel-header" });
  for (const k of headerKids) header.appendChild(k);
  const toggle = el("span", { class: "panel-toggle", text: "▾", title: "Click to collapse" });
  header.appendChild(toggle);
  panel.innerHTML = "";
  panel.appendChild(header);
  panel.appendChild(body);

  const storageKey = `custos.collapsed.${panelId}`;
  // Default = collapsed. Only flip to expanded if the operator has
  // explicitly expanded this panel before (any stored truthy value).
  const wasExpanded = localStorage.getItem(storageKey) === "false";
  if (!wasExpanded) panel.classList.add("collapsed");
  toggle.textContent = panel.classList.contains("collapsed") ? "▸" : "▾";
  header.addEventListener("click", () => {
    const collapsed = panel.classList.toggle("collapsed");
    toggle.textContent = collapsed ? "▸" : "▾";
    try { localStorage.setItem(storageKey, collapsed ? "true" : "false"); } catch { /* private mode etc. */ }
  });
  return panel;
}

async function startOAuthFlow(area) {
  const mode = confirm("Use your Claude Pro/Max subscription? Cancel to create an API key instead (Console mode).") ? "max" : "console";
  try {
    const { flowId, authorizationUrl } = await api("/admin/api/oauth/start", { method: "POST", body: { mode } });
    window.open(authorizationUrl, "_blank");
    area.innerHTML = "";
    const row = el("div", { class: "row" });
    row.appendChild(el("label", { text: "Code" }));
    const input = el("input", { type: "text", placeholder: "paste the code#state shown on the page you just opened" });
    row.appendChild(input);
    row.appendChild(el("button", { class: "primary", text: "Complete", onclick: () => reloadAfter(
      api("/admin/api/oauth/complete", { method: "POST", body: { flowId, code: input.value } }),
      "OAuth connected"
    )}));
    area.appendChild(row);
  } catch (err) {
    showToast(err.message, true);
  }
}

  // -- Model provider instances (new providers shape) ------------------

function enterEditRow(row, name, prov) {
  const wrapper = el("td", { colspan: "8" });
  const form = el("div");

  const urlInput = el("input", { type: "text", value: prov.baseUrl });
  const keyInput = el("input", { type: "password", placeholder: prov.apiKeyConfigured ? "(set -- enter to replace)" : "API key (blank = none)" });

  // --- Cost type selector ---
  const costTypeSelect = el("select", {}, [
    el("option", { value: "free", text: "Free" }),
    el("option", { value: "subscription", text: "Subscription" }),
    el("option", { value: "metered", text: "Metered (pay per token)" }),
  ]);
  costTypeSelect.value = prov.costType || "free";

  // --- Model checkboxes ---
  const modelCheckboxContainer = el("div", {});
  const enabledSet = new Set((prov.models || []).filter(m => m.enabled).map(m => m.name));
  const allModelNames = (prov.models || []).map(m => m.name);
  renderModelCheckboxes(modelCheckboxContainer, allModelNames.map(name => ({ id: name })), enabledSet);
  const modelsHint = el("div", { class: "small", text: `Currently ${(prov.models || []).length} model(s).` });

  // --- Re-scan button for edit form ---
  const rescanBtn = el("button", { text: "Re-scan models", onclick: async () => {
    rescanBtn.disabled = true;
    rescanBtn.textContent = "Scanning...";
    try {
      const result = await api("/admin/api/instances/probe-models", { method: "POST", body: { baseUrl: urlInput.value, apiKey: keyInput.value || undefined } });
      const discovered = result.models || [];
      const currentEnabled = new Set();
      if (modelCheckboxContainer.checkboxes) {
        for (const [name, cb] of modelCheckboxContainer.checkboxes) {
          if (cb.checked) currentEnabled.add(name);
        }
      }
      renderModelCheckboxes(modelCheckboxContainer, discovered, currentEnabled);
      modelsHint.textContent = `Found ${discovered.length} model(s). Check the ones you want enabled.`;
    } catch (err) {
      showToast(err.message, true);
    } finally {
      rescanBtn.disabled = false;
      rescanBtn.textContent = "Re-scan models";
    }
  }});

  // --- Throttle (maxConcurrent) ---
  const throttleInput = el("input", { type: "number", min: "1", step: "1", value: prov.maxConcurrent ?? "", placeholder: "Unlimited" });

  // --- RPM limit ---
  const rpmInput = el("input", { type: "number", min: "1", step: "1", value: prov.rpmLimit ?? "", placeholder: "Unlimited" });

  // --- Max request bytes (Groq-style upstream caps, etc.) ---
  const maxRequestBytesInput = el("input", { type: "number", min: "1024", step: "1", value: prov.maxRequestBytes ?? "", placeholder: "Unlimited (bytes)" });
  maxRequestBytesInput.title = "Hard cap on serialized request body. Set to 33554432 for Groq (32MB).";

  // --- Priority selector ---
  const prioritySelect = el("select", {}, [
    el("option", { value: "interactive", text: "Interactive" }),
    el("option", { value: "background", text: "Background" }),
  ]);
  prioritySelect.value = prov.priority ?? "interactive";

  form.appendChild(el("div", { class: "row" }, [urlInput]));
  form.appendChild(el("div", { class: "row" }, [keyInput]));
  form.appendChild(el("div", { class: "row" }, [
    el("label", { text: "Cost type" }),
    costTypeSelect,
  ]));
  form.appendChild(el("div", { class: "row" }, [
    el("label", { text: "Models" }),
    rescanBtn,
  ]));
  form.appendChild(modelCheckboxContainer);
  form.appendChild(modelsHint);
  form.appendChild(el("div", { class: "row" }, [
    el("label", { text: "Throttle" }),
    throttleInput,
    el("span", { class: "small", text: "max concurrent" }),
    el("label", { text: "RPM limit" }),
    rpmInput,
    el("span", { class: "small", text: "requests/min (set to 10 for Gemini Free)" }),
    el("label", { text: "Max bytes" }),
    maxRequestBytesInput,
    el("span", { class: "small", text: "request body cap (Groq = 33554432 = 32MB, blank = unlimited)" }),
  ]));
  form.appendChild(el("div", { class: "row" }, [
    el("label", { text: "Priority" }),
    prioritySelect,
    el("span", { class: "small", text: "interactive preempts background" }),
  ]));

  // --- Embeddings URL (optional override) ---
  // The runtime derives embeddings.baseUrl from this provider's
  // baseUrl via a port/hostname heuristic (Ollama: strips /v1 and
  // POSTs to /api/embeddings; everything else: keeps the base and
  // POSTs to /embeddings). The override below wins outright — use it
  // when the named provider is OpenAI-compat, when embeddings live
  // on a separate host, or when the heuristic misfires for a custom
  // server bolted onto the 11430-11440 port range. Test button
  // confirms the runtime's effective URL responds to a real POST.
  const embeddingUrlInput = el("input", { type: "text", value: prov.embeddingUrl ?? "", placeholder: "Auto-derived from base URL" });
  const embedProbeBtn = el("button", { style: "font-size: 11px; padding: 3px 8px;", text: "Test embeddings", onclick: async () => {
    embedProbeBtn.disabled = true;
    const originalText = embedProbeBtn.textContent;
    embedProbeBtn.textContent = "↻";
    try {
      // Save the override first so the probe endpoint sees it on
      // runtime.config.providers -- otherwise a probe without Save
      // is testing the OLD config, which is misleading UX. Reload
      // happens after the probe so the user sees the current state.
      await api(`/admin/api/providers/${encodeURIComponent(name)}`, {
        method: "PUT",
        body: {
          baseUrl: urlInput.value,
          costType: costTypeSelect.value,
          models: (prov.models || []).map((m) => ({ name: m.name, enabled: m.enabled })),
          embeddingUrl: embeddingUrlInput.value || null,
        },
      });
      const result = await api(`/admin/api/providers/${encodeURIComponent(name)}/probe-embeddings`, { method: "POST" });
      if (result.ok) {
        embedProbeBtn.textContent = "✓ responding";
        embedProbeBtn.style.color = "var(--ok)";
        embedProbeBtn.title = `resolved to ${result.host}${result.picked ?? ""} via ${result.plan.reason}`;
      } else {
        embedProbeBtn.textContent = "✕ failed";
        embedProbeBtn.style.color = "var(--danger)";
        const errs = (result.tried || []).map((t) => `HTTP ${t.status} ${t.statusText} @${t.path}`).join(", ");
        embedProbeBtn.title = `tried ${result.host}: ${errs}`;
      }
    } catch (err) {
      embedProbeBtn.textContent = "✕";
      embedProbeBtn.style.color = "var(--danger)";
      embedProbeBtn.title = err.message;
    }
    setTimeout(() => {
      embedProbeBtn.disabled = false;
      embedProbeBtn.textContent = originalText;
      embedProbeBtn.style.color = "";
      embedProbeBtn.title = "";
    }, 4000);
  }});
  form.appendChild(el("div", { class: "row" }, [
    el("label", { text: "Embeddings URL" }),
    embeddingUrlInput,
    embedProbeBtn,
    el("span", { class: "small", text: "blank = auto-derived (Ollama: /api/embeddings, others: /embeddings at base); tested against the configured embeddings global agent's per-agent override" }),
  ]));

  form.appendChild(el("p", { class: "small", text: "Per-model pricing (for metered providers, so per-token cost can be recorded against the project budget)." }));
  const inputPriceInput = el("input", { type: "text", placeholder: "$ per 1M input tokens", value: prov.pricing ? String(prov.pricing.inputPerMillion) : "" });
  const outputPriceInput = el("input", { type: "text", placeholder: "$ per 1M output tokens", value: prov.pricing ? String(prov.pricing.outputPerMillion) : "" });
  form.appendChild(el("div", { class: "row" }, [inputPriceInput, outputPriceInput]));

  const saveBtn = el("button", { class: "primary", text: "Save" });
  const cancelBtn = el("button", { text: "Cancel" });
  form.appendChild(el("div", { class: "row" }, [saveBtn, cancelBtn]));

  wrapper.appendChild(form);
  while (row.firstChild) row.removeChild(row.firstChild);
  row.appendChild(wrapper);

  saveBtn.onclick = () => {
    const throttle = parseThrottle(throttleInput);
    if (throttle === undefined) return;
    const rpmRaw = rpmInput.value.trim();
    const rpmVal = rpmRaw ? Number(rpmRaw) : null;
    if (rpmVal !== null && (!Number.isInteger(rpmVal) || rpmVal < 1)) {
      showToast("RPM limit must be a positive integer (or blank for unlimited)", true);
      return;
    }
    const maxBytesRaw = maxRequestBytesInput.value.trim();
    const maxBytesVal = maxBytesRaw ? Number(maxBytesRaw) : null;
    if (maxBytesVal !== null && (!Number.isInteger(maxBytesVal) || maxBytesVal < 1024)) {
      showToast("Max bytes must be a positive integer >= 1024 (or blank for unlimited)", true);
      return;
    }
    const hasPricing = inputPriceInput.value || outputPriceInput.value;
    const pricing = hasPricing ? { inputPerMillion: Number(inputPriceInput.value) || 0, outputPerMillion: Number(outputPriceInput.value) || 0 } : null;
    const models = readModelCheckboxes(modelCheckboxContainer, pricing);
    if (!models.length) {
      showToast("Enable at least one model", true);
      return;
    }
    reloadAfter(api(`/admin/api/providers/${encodeURIComponent(name)}`, {
      method: "PUT",
      body: {
        baseUrl: urlInput.value,
        costType: costTypeSelect.value,
        models,
        apiKey: keyInput.value || null,
        maxConcurrent: throttle,
        rpmLimit: rpmVal,
        maxRequestBytes: maxBytesVal,
        priority: prioritySelect.value,
        embeddingUrl: embeddingUrlInput.value || null,
      },
    }), "Provider saved");
  };
  cancelBtn.onclick = () => loadState();
}

  anthSection.appendChild(el("p", { style: "font-size: 11px; color: var(--muted); margin: 2px 0 0;", text: sourceNote }));

  const anthRpmInput = el("input", { type: "number", min: "1", step: "1", style: "flex: 0 0 80px; font-size: 12px; padding: 4px 7px;", value: anthropic.rpmLimit ?? "", placeholder: "Unlimited" });

    const priorityText = prov.priority == null ? "—" : (prov.priority === "interactive" ? "Interactive" : "Background");
    const costType = prov.costType || "free";

    const expanded = true; // start expanded
    const dataRow = el("tr", { class: "provider-row" }, [
      el("td", {
        class: "provider-name-cell",
        onclick: () => {

          }
          const toggleSpan = dataRow.querySelector(".provider-toggle");
          if (toggleSpan) toggleSpan.textContent = toggleSpan.textContent === "▾" ? "▸" : "▾";
        },
      }, [
        el("span", { class: "provider-toggle", text: "▾" }),
        el("strong", { text: name }),
      ]),
      el("td", { class: "url-cell", text: prov.baseUrl }),
      el("td", {}, [el("span", { class: `cost-chip ${costType}`, text: costText })]),
      el("td", { class: prov.apiKeyConfigured ? "" : "muted", text: prov.apiKeyConfigured ? prov.apiKeyMasked : "—" }),
      el("td", { class: prov.maxConcurrent == null ? "muted" : "", text: throttleText }),
      el("td", { class: prov.rpmLimit == null ? "muted" : "", text: rpmText }),
      el("td", { class: prov.maxRequestBytes == null ? "muted" : "", text: maxBytesText, title: prov.maxRequestBytes == null ? "" : `${prov.maxRequestBytes} bytes` }),

      const enableAll = new Set(discovered.map(m => m.id));

  const rowModels = el("div", { class: "row" }, [el("label", { text: "Models" }), el("span", { class: "small", text: "Scan a provider URL to discover available models" })]);

  const rowThrottle = el("div", { class: "row" }, [
    el("label", { text: "Throttle" }),
    throttleInput,
    el("span", { class: "small", text: "max concurrent" }),
    el("label", { text: "RPM" }),
    rpmInput,
    el("span", { class: "small", text: "req/min (Gemini Free = 10, blank = unlimited)" }),
    el("label", { text: "Max bytes" }),
    maxRequestBytesInput,
    el("span", { class: "small", text: "request body cap (Groq = 33554432 = 32MB, blank = unlimited)" }),
  ]);

  const rowPriority = el("div", { class: "row" }, [
    el("label", { text: "Priority" }),
    prioritySelect,
    el("span", { class: "small", text: "interactive preempts background" }),
  ]);

  const rowProbe = el("div", { class: "row" }, [
    el("button", { text: "Scan models", onclick: async () => {
      if (!urlInput.value) return showToast("Enter a base URL first", true);
      try {
        const result = await api("/admin/api/instances/probe-models", { method: "POST", body: { baseUrl: urlInput.value, apiKey: keyInput.value || undefined } });
        const discovered = result.models || [];
        // All newly discovered models start enabled.
        const enableAll = new Set(discovered.map(m => m.id));
        renderModelCheckboxes(modelCheckboxContainer, discovered, enableAll);
        modelsHint.textContent = `Found ${discovered.length} model(s). Uncheck any you don't want enabled.`;
      } catch (err) {
        modelsHint.textContent = err.message;
      }
    }}),
  ]);

  section.appendChild(el("p", { class: "small", text: "Per-model pricing (for metered providers, so per-token cost can be recorded against the project budget)." }));
  const inputPriceInput = el("input", { type: "text", placeholder: "$ per 1M input tokens" });
  const outputPriceInput = el("input", { type: "text", placeholder: "$ per 1M output tokens" });
  const row4 = el("div", { class: "row" }, [inputPriceInput, outputPriceInput]);

  const row5 = el("div", { class: "row" }, [
    el("button", { class: "primary", text: "Save", onclick: () => {
      if (!nameInput.value || !urlInput.value) return showToast("Fill in name and base URL", true);
      if (!modelCheckboxContainer.checkboxes || !modelCheckboxContainer.checkboxes.size) {
        return showToast("Click 'Scan models' first, then enable at least one model", true);
      }
      const throttle = parseThrottle(throttleInput);
      if (throttle === undefined) return;
      const rpmRaw = rpmInput.value.trim();
      const rpmVal = rpmRaw ? Number(rpmRaw) : null;
      if (rpmVal !== null && (!Number.isInteger(rpmVal) || rpmVal < 1)) {
        showToast("RPM limit must be a positive integer (or blank for unlimited)", true);
        return;
      }
      const hasPricing = inputPriceInput.value || outputPriceInput.value;
      const pricing = hasPricing ? { inputPerMillion: Number(inputPriceInput.value) || 0, outputPerMillion: Number(outputPriceInput.value) || 0 } : null;
      const models = readModelCheckboxes(modelCheckboxContainer, pricing);
      if (!models.length) return showToast("Enable at least one model", true);
      const maxBytesRaw = maxRequestBytesInput.value.trim();
      const maxBytesVal = maxBytesRaw ? Number(maxBytesRaw) : null;
      if (maxBytesVal !== null && (!Number.isInteger(maxBytesVal) || maxBytesVal < 1)) {
        showToast("Max request bytes must be a positive integer (or blank for unlimited)", true);
        return;
      }
      reloadAfter(api(`/admin/api/providers/${encodeURIComponent(nameInput.value)}`, {
        method: "PUT",
        body: {
          baseUrl: urlInput.value,
          costType: costTypeSelect.value,
          models,
          apiKey: keyInput.value || undefined,
          maxConcurrent: throttle,
          rpmLimit: rpmVal,
          priority: prioritySelect.value,
          embeddingUrl: embeddingUrlInput.value || null,
          maxRequestBytes: maxBytesVal,
        },
      }), "Provider saved");
    }}),
  ]);
  section.appendChild(row0);
  section.appendChild(row1);
  section.appendChild(row2);
  section.appendChild(rowModels);
  section.appendChild(rowThrottle);
  section.appendChild(rowPriority);
  section.appendChild(rowEmbedding);
  section.appendChild(rowProbe);
  section.appendChild(modelsHint);
  // The checkboxes populated by renderModelCheckboxes() live on this
  // div. The auto-scan (preset switch) and manual Scan models button
  // both call renderModelCheckboxes(modelCheckboxContainer, ...) which
  // mutates its innerHTML — but until this div is attached to the
  // section those mutations happen off-DOM and remain invisible. The
  // count hint above is set via textContent on a real DOM node, which
  // is why a scan visibly reports the right number but never shows the
  // selector itself.
  section.appendChild(modelCheckboxContainer);
  section.appendChild(row4);
  section.appendChild(row5);

  return section;
}

// -- Global services (memory curator, permission classifier, embeddings) --
//
// Each global service is an AgentDef with kind="global" and a built-in
// systemRole. The same provider dropdown used for project agents shows
// up here so the model/provider choice is answered from one place. The
// embeddings row has one extra `embeddingBaseUrl` field — Ollama exposes
// /api/embeddings on a different path than the OpenAI-compat chat one,
// and someone pointing a custom Ollama host at the embeddings agent
// needs that override to surface in the UI.
function renderGlobalServicesPanel(providers) {

  section.appendChild(el("p", { class: "desc", text: "Project-orthogonal services the gateway runs in the background: memory curator (extracts facts from sessions), permission classifier (gates tool calls), embeddings (powers memory search). " }));

    el("col", { style: "width: 22%;" }),
    el("col", { style: "width: 28%;" }),
    el("col", { style: "width: 22%;" }),
    el("col", { style: "width: 18%;" }),
    el("col", { style: "width: 10%;" }),
  ]));
  table.appendChild(el("tr", {}, [
    el("th", { text: "Service" }),
    el("th", { text: "Provider" }),
    el("th", { text: "Model" }),
    el("th", { text: "Endpoint" }),

  for (const agent of agents) {

    const providerSelect = el("select", {});
    for (const key of providerOptions) {
      const opt = el("option", { value: key, text: key });
      if (key === agent.providerKey) opt.setAttribute("selected", "selected");
      providerSelect.appendChild(opt);
    }
    const modelInput = el("input", { type: "text", value: agent.model, placeholder: "model name" });
    const endpointInput = el("input", {
      type: "text",
      value: agent.embeddingBaseUrl || "",
      placeholder: agent.systemRole === "embeddings" ? "default: derived from provider host" : "(only for embeddings)",
      disabled: agent.systemRole !== "embeddings" ? "disabled" : undefined,
    });
    const saveBtn = el("button", { class: "row-btn primary", text: "Save", onclick: () => {
      const patch = {
        providerKey: providerSelect.value,
        model: modelInput.value,
        embeddingBaseUrl: agent.systemRole === "embeddings" ? (endpointInput.value || null) : undefined,
      };
      reloadAfter(api(`/admin/api/global-agents/${encodeURIComponent(agent.systemRole)}`, {
        method: "PATCH",
        body: patch,
      }), `${labelForRole(agent.systemRole)} updated`);
    }});
    const row = el("tr", {}, [
      el("td", {}, [
        el("strong", { text: labelForRole(agent.systemRole) }),
        el("br"),
        el("span", { class: "small", text: agent.name }),
      ]),
