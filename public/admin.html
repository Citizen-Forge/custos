<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Custos Admin</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1c1f26;
    --border: #2b2f38;
    --text: #e4e6eb;
    --muted: #8b93a1;
    --accent: #5b9dd9;
    --danger: #d9705b;
    --ok: #5bd98f;
    --warn: #d9c15b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  header button { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; }
  header button:hover { color: var(--text); border-color: var(--muted); }
  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 24px 28px 80px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  section.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
  }
  section.panel h2 { margin: 0 0 4px; font-size: 15px; }
  section.panel .desc { color: var(--muted); font-size: 12.5px; margin: 0 0 16px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  label { color: var(--muted); font-size: 12.5px; min-width: 70px; }
  input[type=text], input[type=password], input[type=number], select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 9px;
    font-size: 13px;
    font-family: inherit;
  }
  input[type=text], input[type=password], input[type=number] { flex: 1; min-width: 160px; }
  /* Tighter layout when a number sits inline with a small label and a
     helper-text span on the same row -- the default `flex: 1` would
     stretch it across the full panel width and crowd out the helper. */
  .row input[type=number] { flex: 0 0 110px; min-width: 0; }
  button {
    background: #262a33;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 13px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #2f3440; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.ok { background: rgba(91,217,143,0.15); color: var(--ok); }
  .badge.warn { background: rgba(217,193,91,0.15); color: var(--warn); }
  .badge.off { background: rgba(139,147,161,0.15); color: var(--muted); }
  table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .providers-table { table-layout: fixed; border-spacing: 0; }
  .providers-table td, .providers-table th { vertical-align: middle; }
  .providers-table .actions-cell { white-space: nowrap; text-align: right; padding-right: 12px; }
  .providers-table .row-btn { font-size: 11px; padding: 3px 7px; margin-left: 3px; }
  .providers-table .row-btn:first-child { margin-left: 0; }
  .providers-table .row-btn.danger { color: var(--danger); }
  .providers-table .cost-chip {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .providers-table .cost-chip.free { background: rgba(91,217,143,0.15); color: var(--ok); }
  .providers-table .cost-chip.subscription { background: rgba(91,193,219,0.15); color: var(--accent); }
  .providers-table .cost-chip.metered { background: rgba(217,193,91,0.15); color: var(--warn); }
  .providers-table .url-cell { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; word-break: break-all; }
  .providers-table .muted { color: var(--muted); }
  .providers-table .provider-name-cell { cursor: pointer; user-select: none; }
  .providers-table .provider-name-cell > strong { pointer-events: none; }
  .providers-table .provider-toggle { color: var(--muted); font-size: 10px; flex-shrink: 0; width: 10px; display: inline-block; margin-right: 6px; }
  .providers-table .model-detail td { padding: 5px 12px 5px 36px; font-size: 12px; background: rgba(255,255,255,0.025); border-bottom: 1px solid rgba(255,255,255,0.04); }
  .providers-table .separator td { padding: 0; border-bottom: 1px solid var(--border); height: 6px; }
  .task-block { margin-bottom: 18px; }
  .task-block h3 { font-size: 13px; margin: 0 0 8px; color: var(--text); }
  pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    overflow-x: auto;
    font-size: 12.5px;
    margin: 0 0 8px;
  }
  .copy-row { display: flex; justify-content: flex-end; margin-top: -4px; margin-bottom: 12px; }
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.15s, transform 0.15s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .budget-bar {
    background: var(--bg);
    border-radius: 999px;
    height: 8px;
    overflow: hidden;
    margin: 4px 0;
    flex: 1;
    min-width: 120px;
  }
  .budget-bar-fill {
    height: 100%;
    border-radius: 999px;
    transition: width 0.3s ease;
  }
  .budget-bar-fill.ok { background: var(--ok); }
  .budget-bar-fill.warn { background: var(--warn); }
  .budget-bar-fill.danger { background: var(--danger); }
  .budget-label { font-variant-numeric: tabular-nums; font-size: 12.5px; white-space: nowrap; }
  hr.sep { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .small { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Custos</h1>
    <p>Providers, projects, and agent orchestration</p>
  </div>
  <div style="display: flex; align-items: center; gap: 10px;">
    <span id="commit-hash" class="small" style="font-size: 11px; font-family: monospace;"></span>
    <button onclick="fetch('/logout', {method: 'POST'}).then(() => location.href = '/login')">Log out</button>
  </div>
</header>
<main id="app">
  <section class="panel"><p class="small">Loading…</p></section>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (sel, el = document) => el.querySelector(sel);
const el = (tag, attrs = {}, children = []) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) if (c) node.appendChild(c);
  return node;
};

let state = null;

function showToast(message, isError = false) {
  const t = $("#toast");
  t.textContent = message;
  t.className = "toast show" + (isError ? " error" : "");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => { t.className = "toast"; }, 3000);
}

// Renders a set of model checkboxes inside `container`. `models` is an
// array of { id, owned_by?, created? } from the probe endpoint. `enabledSet`
// is a Set of model names that should be pre-checked. Each model gets a
// checkbox + label. New models (not in enabledSet) start unchecked.
// The checkboxes are stored on `container.checkboxes` as a Map<name, input>.
function renderModelCheckboxes(container, models, enabledSet) {
  container.innerHTML = "";
  container.checkboxes = new Map();
  if (!models || !models.length) {
    container.appendChild(el("div", { class: "small", text: "No models found. Enter model names manually or scan again." }));
    return;
  }
  const grid = el("div", { style: "display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0;" });
  for (const model of models) {
    const id = model.id || model;
    const checked = enabledSet.has(id);
    const label = el("label", {
      style: "display: inline-flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer;",
    });
    const cb = el("input", { type: "checkbox", checked: checked ? "checked" : undefined });
    label.appendChild(cb);
    label.appendChild(el("span", { text: id }));
    container.checkboxes.set(id, cb);
    grid.appendChild(label);
  }
  container.appendChild(grid);
}

// Reads a throttle input element. Returns:
//   - undefined when the value is invalid (toast already shown) -- caller should bail
//   - null when the field is blank (== "unlimited", wire-serialized as null)
//   - a positive integer otherwise (== "throttle on, capped at N")
// `null` on the wire maps to an omitted `maxConcurrent` on config.json, so an
// unlimited instance round-trips cleanly through saveConfig -> loadConfig.
function parseThrottle(input) {
  const raw = input.value.trim();
  const value = raw ? Number(raw) : null;
  if (value !== null && (!Number.isInteger(value) || value < 1)) {
    showToast("Max concurrent must be a positive integer (or blank for unlimited)", true);
    return undefined;
  }
  return value;
}

// Reads model checkboxes from a container rendered by renderModelCheckboxes.
// Returns an array of { name, enabled } objects for the provider PUT body.
function readModelCheckboxes(container, pricing) {
  if (!container.checkboxes || container.checkboxes.size === 0) return [];
  const models = [];
  let first = true;
  for (const [name, cb] of container.checkboxes) {
    models.push({
      name,
      enabled: cb.checked,
      ...(first && pricing ? { pricing } : {}),
    });
    first = false;
  }
  return models;
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "content-type": "application/json", ...(opts.headers || {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) {
    location.href = "/login?next=" + encodeURIComponent(location.pathname);
    return new Promise(() => {}); // never resolves -- we're navigating away
  }
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
  return json;
}

async function loadState() {
  state = await api("/admin/api/state");
  // Fetch version (commit hash) and display in header.
  api("/admin/api/version").then((v) => {
    const el = document.getElementById("commit-hash");
    if (el && v.commit) {
      el.textContent = v.commit;
      el.title = `Deployed commit: ${v.commit}`;
    }
  }).catch(() => {/* version endpoint is informational only */});
  // Global services (memory curator, permission classifier, embeddings)
  // share their own panel. Pre-load so render() can show them without
  // a follow-up fetch.
  try {
    state.globalAgents = (await api("/admin/api/global-agents")).agents || [];
  } catch {
    state.globalAgents = [];
  }
  state.projects = (await api("/admin/api/projects")).projects;
  for (const project of state.projects) {
    // Chats are lazy-loaded on first click of the chat toggle — no pre-fetch.
    project.chats = null;
    // Fetch per-project settings which include budget + spend data AND agent roster.
    const settingsResp = await api(`/admin/api/projects/${project.id}/settings`);
    project.budget = settingsResp.settings.budget;
    project.spentUsd = settingsResp.spentUsd ?? 0;
    project.subscriptionUsd = settingsResp.subscriptionUsd ?? 0;
    project.agents = settingsResp.agents ?? [];
    project.pmLastRunAt = settingsResp.settings.pmLastRunAt ?? null;
    project.paused = settingsResp.settings.paused ?? false;
  }
  render();
}

async function reloadAfter(promise, successMessage) {
  try {
    await promise;
    showToast(successMessage);
    await loadState();
  } catch (err) {
    showToast(err.message, true);
  }
}

function render() {
  const app = $("#app");
  app.innerHTML = "";
  app.appendChild(renderProvidersPanel());
  app.appendChild(renderGlobalServicesPanel(state.providers));
  app.appendChild(renderProjectsPanel());
  app.appendChild(renderSecurityPanel());
}

async function startOAuthFlow(area) {
  const mode = confirm("Use your Claude Pro/Max subscription? Cancel to create an API key instead (Console mode).") ? "max" : "console";
  try {
    const { flowId, authorizationUrl } = await api("/admin/api/oauth/start", { method: "POST", body: { mode } });
    window.open(authorizationUrl, "_blank");
    area.innerHTML = "";
    const row = el("div", { class: "row" });
    row.appendChild(el("label", { text: "Code" }));
    const input = el("input", { type: "text", placeholder: "paste the code#state shown on the page you just opened" });
    row.appendChild(input);
    row.appendChild(el("button", { class: "primary", text: "Complete", onclick: () => reloadAfter(
      api("/admin/api/oauth/complete", { method: "POST", body: { flowId, code: input.value } }),
      "OAuth connected"
    )}));
    area.appendChild(row);
  } catch (err) {
    showToast(err.message, true);
  }
}

  // -- Model provider instances (new providers shape) ------------------

function enterEditRow(row, name, prov) {
  const wrapper = el("td", { colspan: "8" });
  const form = el("div");

  const urlInput = el("input", { type: "text", value: prov.baseUrl });
  const keyInput = el("input", { type: "password", placeholder: prov.apiKeyConfigured ? "(set -- enter to replace)" : "API key (blank = none)" });

  // --- Cost type selector ---
  const costTypeSelect = el("select", {}, [
    el("option", { value: "free", text: "Free" }),
    el("option", { value: "subscription", text: "Subscription" }),
    el("option", { value: "metered", text: "Metered (pay per token)" }),
  ]);
  costTypeSelect.value = prov.costType || "free";

  // --- Model checkboxes ---
  const modelCheckboxContainer = el("div", {});
  const enabledSet = new Set((prov.models || []).filter(m => m.enabled).map(m => m.name));
  const allModelNames = (prov.models || []).map(m => m.name);
  renderModelCheckboxes(modelCheckboxContainer, allModelNames.map(name => ({ id: name })), enabledSet);
  const modelsHint = el("div", { class: "small", text: `Currently ${(prov.models || []).length} model(s).` });

  // --- Re-scan button for edit form ---
  const rescanBtn = el("button", { text: "Re-scan models", onclick: async () => {
    rescanBtn.disabled = true;
    rescanBtn.textContent = "Scanning...";
    try {
      const result = await api("/admin/api/instances/probe-models", { method: "POST", body: { baseUrl: urlInput.value, apiKey: keyInput.value || undefined } });
      const discovered = result.models || [];
      const currentEnabled = new Set();
      if (modelCheckboxContainer.checkboxes) {
        for (const [name, cb] of modelCheckboxContainer.checkboxes) {
          if (cb.checked) currentEnabled.add(name);
        }
      }
      renderModelCheckboxes(modelCheckboxContainer, discovered, currentEnabled);
      modelsHint.textContent = `Found ${discovered.length} model(s). Check the ones you want enabled.`;
    } catch (err) {
      showToast(err.message, true);
    } finally {
      rescanBtn.disabled = false;
      rescanBtn.textContent = "Re-scan models";
    }
  }});

  // --- Throttle (maxConcurrent) ---
  const throttleInput = el("input", { type: "number", min: "1", step: "1", value: prov.maxConcurrent ?? "", placeholder: "Unlimited" });

  // --- RPM limit ---
  const rpmInput = el("input", { type: "number", min: "1", step: "1", value: prov.rpmLimit ?? "", placeholder: "Unlimited" });

  // --- Priority selector ---
  const prioritySelect = el("select", {}, [
    el("option", { value: "interactive", text: "Interactive" }),
    el("option", { value: "background", text: "Background" }),
  ]);
  prioritySelect.value = prov.priority ?? "interactive";

  form.appendChild(el("div", { class: "row" }, [urlInput]));
  form.appendChild(el("div", { class: "row" }, [keyInput]));
  form.appendChild(el("div", { class: "row" }, [
    el("label", { text: "Cost type" }),
    costTypeSelect,
  ]));
  form.appendChild(el("div", { class: "row" }, [
    el("label", { text: "Models" }),
    rescanBtn,
  ]));
  form.appendChild(modelCheckboxContainer);
  form.appendChild(modelsHint);
  form.appendChild(el("div", { class: "row" }, [
    el("label", { text: "Throttle" }),
    throttleInput,
    el("span", { class: "small", text: "max concurrent" }),
    el("label", { text: "RPM limit" }),
    rpmInput,
    el("span", { class: "small", text: "requests/min (set to 10 for Gemini Free)" }),
  ]));
  form.appendChild(el("div", { class: "row" }, [
    el("label", { text: "Priority" }),
    prioritySelect,
    el("span", { class: "small", text: "interactive preempts background" }),
  ]));

  form.appendChild(el("p", { class: "small", text: "Per-model pricing (for metered providers, so per-token cost can be recorded against the project budget)." }));
  const inputPriceInput = el("input", { type: "text", placeholder: "$ per 1M input tokens", value: prov.pricing ? String(prov.pricing.inputPerMillion) : "" });
  const outputPriceInput = el("input", { type: "text", placeholder: "$ per 1M output tokens", value: prov.pricing ? String(prov.pricing.outputPerMillion) : "" });
  form.appendChild(el("div", { class: "row" }, [inputPriceInput, outputPriceInput]));

  const saveBtn = el("button", { class: "primary", text: "Save" });
  const cancelBtn = el("button", { text: "Cancel" });
  form.appendChild(el("div", { class: "row" }, [saveBtn, cancelBtn]));

  wrapper.appendChild(form);
  while (row.firstChild) row.removeChild(row.firstChild);
  row.appendChild(wrapper);

  saveBtn.onclick = () => {
    const throttle = parseThrottle(throttleInput);
    if (throttle === undefined) return;
    const rpmRaw = rpmInput.value.trim();
    const rpmVal = rpmRaw ? Number(rpmRaw) : null;
    if (rpmVal !== null && (!Number.isInteger(rpmVal) || rpmVal < 1)) {
      showToast("RPM limit must be a positive integer (or blank for unlimited)", true);
      return;
    }
    const hasPricing = inputPriceInput.value || outputPriceInput.value;
    const pricing = hasPricing ? { inputPerMillion: Number(inputPriceInput.value) || 0, outputPerMillion: Number(outputPriceInput.value) || 0 } : null;
    const models = readModelCheckboxes(modelCheckboxContainer, pricing);
    if (!models.length) {
      showToast("Enable at least one model", true);
      return;
    }
    reloadAfter(api(`/admin/api/providers/${encodeURIComponent(name)}`, {
      method: "PUT",
      body: {
        baseUrl: urlInput.value,
        costType: costTypeSelect.value,
        models,
        apiKey: keyInput.value || null,
        maxConcurrent: throttle,
        rpmLimit: rpmVal,
        priority: prioritySelect.value,
      },
    }), "Provider saved");
  };
  cancelBtn.onclick = () => loadState();
}

function renderProvidersPanel() {
  const section = el("section", { class: "panel" });
  section.appendChild(el("h2", { text: "Model providers" }));
  section.appendChild(el("p", { class: "desc", text: "Anthropic (Claude) is built-in with OAuth support. OpenAI-compatible providers — Ollama, OpenAI, DeepSeek, Gemini, Groq, Mistral, xAI, OpenRouter — share a standard API pattern. Each provider can serve multiple models." }));

  // --- Anthropic section (embedded inside Model providers panel) ---
  const { anthropic } = state;
  const anthSection = el("div", { style: "background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 16px;" });
  anthSection.appendChild(el("strong", { style: "font-size: 13px;", text: "Anthropic (Claude)" }));

  // OAuth row
  const oauthRow = el("div", { class: "row", style: "margin-bottom: 6px;" });
  const oauthBadge = anthropic.oauth.connected
    ? el("span", {
        class: "badge ok",
        style: "font-size: 11px;",
        text: "OAuth: Connected",
        title: anthropic.oauth.source === "claude-code"
          ? "Token is reused from an existing local OAuth login (skipped Custos's own OAuth flow)."
          : "Token was issued through Custos's own OAuth flow -- valid until expiry.",
      })
    : el("span", { class: "badge off", style: "font-size: 11px;", text: "OAuth: Not connected" });
  oauthRow.appendChild(oauthBadge);
  if (anthropic.oauth.connected) {
    oauthRow.appendChild(el("button", { style: "font-size: 11px; padding: 3px 8px; color: var(--danger);", text: "Disconnect OAuth", onclick: () => reloadAfter(api("/admin/api/oauth/disconnect", { method: "POST" }), "OAuth disconnected") }));
  } else {
    oauthRow.appendChild(el("button", { style: "font-size: 11px; padding: 3px 8px;", text: "Connect OAuth", onclick: () => startOAuthFlow($("#oauth-flow-area")) }));
  }
  // Probe button — test Anthropic connectivity with the configured auth.
  const anthProbeBtn = el("button", { style: "font-size: 11px; padding: 3px 8px;", text: "Test", onclick: async () => {
    anthProbeBtn.disabled = true;
    anthProbeBtn.textContent = "↻";
    try {
      const result = await api("/admin/api/anthropic/probe", { method: "POST" });
      if (result.ok) {
        anthProbeBtn.textContent = "✓";
        anthProbeBtn.style.color = "var(--ok)";
        anthProbeBtn.title = `HTTP ${result.status}${result.statusText ? ` — ${result.statusText}` : ""}`;
      } else {
        anthProbeBtn.textContent = "✕";
        anthProbeBtn.style.color = "var(--danger)";
        anthProbeBtn.title = result.error || "Probe failed";
      }
    } catch (err) {
      anthProbeBtn.textContent = "✕";
      anthProbeBtn.style.color = "var(--danger)";
      anthProbeBtn.title = err.message;
    }
    setTimeout(() => {
      anthProbeBtn.disabled = false;
      anthProbeBtn.textContent = "Test";
      anthProbeBtn.style.color = "";
      anthProbeBtn.title = "";
    }, 3000);
  }});
  oauthRow.appendChild(anthProbeBtn);
  anthSection.appendChild(oauthRow);
  anthSection.appendChild(el("div", { id: "oauth-flow-area", style: "margin-top: 4px;" }));

  // API key row
  const anthKeyRow = el("div", { class: "row", style: "margin-bottom: 0;" });
  const anthKeyInput = el("input", { type: "password", style: "flex: 0 0 200px; font-size: 12px; padding: 4px 7px;", placeholder: anthropic.apiKeyMasked || "Fallback API key (sk-ant-...)" });
  anthKeyRow.appendChild(el("span", { style: "font-size: 12px; color: var(--muted); min-width: 50px;", text: "API key" }));
  anthKeyRow.appendChild(anthKeyInput);
  anthKeyRow.appendChild(el("button", { style: "font-size: 11px; padding: 3px 8px;", class: "primary", text: "Save", onclick: () => {
    if (!anthKeyInput.value) return showToast("Enter a key first", true);
    reloadAfter(api("/admin/api/anthropic", { method: "PUT", body: { apiKey: anthKeyInput.value } }), "API key saved");
  }}));
  if (anthropic.apiKeySource !== "none") {
    anthKeyRow.appendChild(el("button", { style: "font-size: 11px; padding: 3px 8px;", text: "Clear", onclick: () => reloadAfter(api("/admin/api/anthropic", { method: "PUT", body: { apiKey: null } }), "API key cleared") }));
  }
  anthSection.appendChild(anthKeyRow);
  const sourceNote = anthropic.apiKeySource === "env" ? "using ANTHROPIC_API_KEY from the environment — OAuth is tried first" :
    anthropic.apiKeySource === "file" ? `configured (${anthropic.apiKeyMasked})` : "not configured — used as fallback when OAuth is unavailable";
  anthSection.appendChild(el("p", { style: "font-size: 11px; color: var(--muted); margin: 2px 0 0;", text: sourceNote }));

  // Throttle + RPM row
  const anthThrottleRow = el("div", { class: "row", style: "margin-top: 8px; margin-bottom: 0;" });
  const anthThrottleInput = el("input", { type: "number", min: "1", step: "1", style: "flex: 0 0 80px; font-size: 12px; padding: 4px 7px;", value: anthropic.maxConcurrent ?? "", placeholder: "Unlimited" });
  const anthRpmInput = el("input", { type: "number", min: "1", step: "1", style: "flex: 0 0 80px; font-size: 12px; padding: 4px 7px;", value: anthropic.rpmLimit ?? "", placeholder: "Unlimited" });
  anthThrottleRow.appendChild(el("span", { style: "font-size: 12px; color: var(--muted); min-width: 50px;", text: "Throttle" }));
  anthThrottleRow.appendChild(anthThrottleInput);
  anthThrottleRow.appendChild(el("span", { class: "small", text: "max concurrent" }));
  anthThrottleRow.appendChild(el("span", { style: "font-size: 12px; color: var(--muted); margin-left: 12px;", text: "RPM" }));
  anthThrottleRow.appendChild(anthRpmInput);
  anthThrottleRow.appendChild(el("span", { class: "small", text: "requests/min" }));
  anthThrottleRow.appendChild(el("button", { style: "font-size: 11px; padding: 3px 8px;", text: "Save", onclick: () => {
    const maxC = parseThrottle(anthThrottleInput);
    if (maxC === undefined) return;
    const rpmRaw = anthRpmInput.value.trim();
    const rpmVal = rpmRaw ? Number(rpmRaw) : null;
    if (rpmVal !== null && (!Number.isInteger(rpmVal) || rpmVal < 1)) {
      showToast("RPM limit must be a positive integer (or blank for unlimited)", true);
      return;
    }
    reloadAfter(api("/admin/api/anthropic", { method: "PUT", body: { maxConcurrent: maxC, rpmLimit: rpmVal } }), "Throttle settings saved");
  }}));
  anthSection.appendChild(anthThrottleRow);

  section.appendChild(anthSection);

  const table = el("table", { class: "providers-table" });
  table.appendChild(el("colgroup", {}, [
    el("col", { style: "width: 19%;" }),
    el("col", { style: "width: 23%;" }),
    el("col", { style: "width: 8%;" }),
    el("col", { style: "width: 14%;" }),
    el("col", { style: "width: 8%;" }),
    el("col", { style: "width: 7%;" }),
    el("col", { style: "width: 9%;" }),
    el("col", { style: "width: 12%;" }),
  ]));
  table.appendChild(el("tr", {}, [
    el("th", { text: "Provider" }), el("th", { text: "Base URL" }), el("th", { text: "Cost" }), el("th", { text: "API key" }), el("th", { text: "Throttle" }), el("th", { text: "RPM" }), el("th", { text: "Priority" }), el("th", { text: "Actions" }),
  ]));
  for (const [name, prov] of Object.entries(state.providers)) {
    const throttleText = prov.maxConcurrent == null ? "—" : String(prov.maxConcurrent);
    const rpmText = prov.rpmLimit == null ? "—" : String(prov.rpmLimit);
    const priorityText = prov.priority == null ? "—" : (prov.priority === "interactive" ? "Interactive" : "Background");
    const costType = prov.costType || "free";
    const costText = { free: "Free", subscription: "Sub", metered: "Metered" }[costType] || costType;
    const expanded = true; // start expanded
    const dataRow = el("tr", { class: "provider-row" }, [
      el("td", {
        class: "provider-name-cell",
        onclick: () => {
          // Toggle visibility of model detail rows beneath this provider.
          let sib = dataRow.nextElementSibling;
          while (sib && sib.classList.contains("model-detail")) {
            const hidden = sib.style.display === "none";
            sib.style.display = hidden ? "" : "none";
            sib = sib.nextElementSibling;
          }
          const toggleSpan = dataRow.querySelector(".provider-toggle");
          if (toggleSpan) toggleSpan.textContent = toggleSpan.textContent === "▾" ? "▸" : "▾";
        },
      }, [
        el("span", { class: "provider-toggle", text: "▾" }),
        el("strong", { text: name }),
      ]),
      el("td", { class: "url-cell", text: prov.baseUrl }),
      el("td", {}, [el("span", { class: `cost-chip ${costType}`, text: costText })]),
      el("td", { class: prov.apiKeyConfigured ? "" : "muted", text: prov.apiKeyConfigured ? prov.apiKeyMasked : "—" }),
      el("td", { class: prov.maxConcurrent == null ? "muted" : "", text: throttleText }),
      el("td", { class: prov.rpmLimit == null ? "muted" : "", text: rpmText }),
      el("td", { class: prov.priority == null ? "muted" : "", text: priorityText }),
      el("td", { class: "actions-cell" }, [
        el("button", { class: "row-btn", text: "Test", onclick: async (ev) => {
          const btn = ev.currentTarget;
          btn.disabled = true;
          btn.textContent = "↻";
          try {
            const result = await api(`/admin/api/providers/${encodeURIComponent(name)}/probe`, { method: "POST" });
            if (result.ok) {
              btn.textContent = "✓";
              btn.style.color = "var(--ok)";
              btn.title = `HTTP ${result.status}${result.statusText ? ` — ${result.statusText}` : ""}`;
            } else {
              btn.textContent = "✕";
              btn.style.color = "var(--danger)";
              btn.title = result.error || "Probe failed";
            }
          } catch (err) {
            btn.textContent = "✕";
            btn.style.color = "var(--danger)";
            btn.title = err.message;
          }
          setTimeout(() => {
            btn.disabled = false;
            btn.textContent = "Test";
            btn.style.color = "";
            btn.title = "";
          }, 3000);
        }}),
        el("button", { class: "row-btn", text: "Edit", onclick: () => enterEditRow(dataRow, name, prov) }),
        el("button", { class: "row-btn danger", text: "Delete", onclick: () => reloadAfter(
          api(`/admin/api/providers/${encodeURIComponent(name)}`, { method: "DELETE" }), `Removed "${name}"`
        )}),
      ]),
    ]);
    table.appendChild(dataRow);

    // Model sub-rows — visible by default, toggled by clicking the provider name.
    const models = prov.models || [];
    for (const model of models) {
      const modelRow = el("tr", { class: "model-detail" });
      const modelTd = el("td", { colspan: "8" });
      // Inline toggle to enable/disable a model without opening the edit form.
      const toggleLabel = el("label", {
        style: "display: inline-flex; align-items: center; gap: 3px; margin-right: 6px; cursor: pointer; font-size: 11px;",
        title: model.enabled ? "Disable this model" : "Enable this model",
      });
      const toggleCb = el("input", { type: "checkbox", checked: model.enabled ? "checked" : undefined, style: "margin: 0;" });
      const toggleBadge = el("span", { text: model.enabled ? "✓" : "✕", style: model.enabled ? "color: var(--ok);" : "color: var(--muted);" });
      toggleCb.onchange = async () => {
        const enabled = toggleCb.checked;
        try {
          await api(`/admin/api/providers/${encodeURIComponent(name)}/models/${encodeURIComponent(model.name)}`, {
            method: "PATCH",
            body: { enabled },
          });
          toggleLabel.title = enabled ? "Disable this model" : "Enable this model";
          toggleBadge.textContent = enabled ? "✓" : "✕";
          toggleBadge.style.color = enabled ? "var(--ok)" : "var(--muted)";
        } catch (err) {
          // Revert the checkbox on failure.
          toggleCb.checked = !enabled;
          showToast(err.message, true);
        }
      };
      toggleLabel.appendChild(toggleCb);
      toggleLabel.appendChild(toggleBadge);
      modelTd.appendChild(toggleLabel);
      modelTd.appendChild(el("code", { style: "font-size: 12px;", text: model.name }));
      if (model.pricing) {
        modelTd.appendChild(el("span", { class: "small", style: "margin-left: 12px;", text: `In: $${model.pricing.inputPerMillion}/1M  Out: $${model.pricing.outputPerMillion}/1M` }));
      } else {
        modelTd.appendChild(el("span", { class: "small", style: "margin-left: 12px;", text: "—" }));
      }
      modelRow.appendChild(modelTd);
      table.appendChild(modelRow);
    }
    // Separator row between providers
    table.appendChild(el("tr", { class: "separator" }, [
      el("td", { colspan: "8" }),
    ]));
  }
  section.appendChild(table);

  section.appendChild(el("hr", { class: "sep" }));
  section.appendChild(el("p", { class: "small", text: "Add or update a provider" }));

  const nameInput = el("input", { type: "text", placeholder: "name (e.g. gemini-free)" });
  const urlInput = el("input", { type: "text", placeholder: "base URL" });
  const keyInput = el("input", { type: "password", placeholder: "API key (leave blank if none)" });

  // --- Cost type selector for new providers ---
  const costTypeSelect = el("select", {}, [
    el("option", { value: "free", text: "Free (no cost, rate-limited)" }),
    el("option", { value: "subscription", text: "Subscription (flat fee)" }),
    el("option", { value: "metered", text: "Metered (pay per token)" }),
  ]);

  // --- Model checkboxes (populated by Scan) ---
  const modelCheckboxContainer = el("div", {});
  const modelsHint = el("div", { class: "small" });

  // --- Throttle (maxConcurrent) ---
  const throttleInput = el("input", { type: "number", min: "1", step: "1", placeholder: "Unlimited" });

  // --- RPM limit (new!) ---
  const rpmInput = el("input", { type: "number", min: "1", step: "1", value: "10", placeholder: "RPM limit" });
  // Auto-fill RPM to 10 for known rate-limited presets.
  function autoFillRpm(presetId) {
    if (presetId === "gemini") { rpmInput.value = "10"; }
    else if (presetId.startsWith("ollama")) { rpmInput.value = ""; }
    else { rpmInput.value = ""; }
  }

  // --- Priority selector ---
  const prioritySelect = el("select", {}, [
    el("option", { value: "interactive", text: "Interactive" }),
    el("option", { value: "background", text: "Background" }),
  ]);

  async function autoScanModels() {
    if (!urlInput.value) return;
    try {
      const result = await api("/admin/api/instances/probe-models", { method: "POST", body: { baseUrl: urlInput.value, apiKey: keyInput.value || undefined } });
      const discovered = result.models || [];
      const enableAll = new Set(discovered.map(m => m.id));
      renderModelCheckboxes(modelCheckboxContainer, discovered, enableAll);
      modelsHint.textContent = `Found ${discovered.length} model(s). Uncheck any you don't want enabled.`;
    } catch {
      // Auto-scan failed; user can click "Scan models" manually.
    }
  }

  const presetSelect = el("select", { onchange: (ev) => {
    const preset = state.providerPresets.find((p) => p.id === ev.target.value);
    if (preset && preset.id !== "custom") urlInput.value = preset.baseUrl;
    if (preset && !nameInput.value) nameInput.value = preset.id;
    autoFillRpm(preset ? preset.id : "");
    if (preset && preset.id.startsWith("ollama")) {
      throttleInput.value = "1";
      throttleInput.placeholder = "1 (Ollama preset)";
      prioritySelect.value = "background";
    } else if (preset && preset.id !== "custom") {
      throttleInput.value = "";
      throttleInput.placeholder = "Unlimited";
      prioritySelect.value = "interactive";
    }
    // Auto-scan models for known presets so models appear immediately.
    autoScanModels();
  }});
  for (const preset of state.providerPresets) {
    presetSelect.appendChild(el("option", { value: preset.id, text: preset.label }));
  }

  const row0 = el("div", { class: "row" }, [el("label", { text: "Preset" }), presetSelect]);
  const row1 = el("div", { class: "row" }, [nameInput, urlInput]);
  const row2 = el("div", { class: "row" }, [el("label", { text: "Cost" }), costTypeSelect, keyInput]);
  const rowModels = el("div", { class: "row" }, [el("label", { text: "Models" }), el("span", { class: "small", text: "Scan a provider URL to discover available models" })]);

  const rowThrottle = el("div", { class: "row" }, [
    el("label", { text: "Throttle" }),
    throttleInput,
    el("span", { class: "small", text: "max concurrent" }),
    el("label", { text: "RPM" }),
    rpmInput,
    el("span", { class: "small", text: "req/min (Gemini Free = 10, blank = unlimited)" }),
  ]);

  const rowPriority = el("div", { class: "row" }, [
    el("label", { text: "Priority" }),
    prioritySelect,
    el("span", { class: "small", text: "interactive preempts background" }),
  ]);

  const rowProbe = el("div", { class: "row" }, [
    el("button", { text: "Scan models", onclick: async () => {
      if (!urlInput.value) return showToast("Enter a base URL first", true);
      try {
        const result = await api("/admin/api/instances/probe-models", { method: "POST", body: { baseUrl: urlInput.value, apiKey: keyInput.value || undefined } });
        const discovered = result.models || [];
        // All newly discovered models start enabled.
        const enableAll = new Set(discovered.map(m => m.id));
        renderModelCheckboxes(modelCheckboxContainer, discovered, enableAll);
        modelsHint.textContent = `Found ${discovered.length} model(s). Uncheck any you don't want enabled.`;
      } catch (err) {
        modelsHint.textContent = err.message;
      }
    }}),
  ]);

  section.appendChild(el("p", { class: "small", text: "Per-model pricing (for metered providers, so per-token cost can be recorded against the project budget)." }));
  const inputPriceInput = el("input", { type: "text", placeholder: "$ per 1M input tokens" });
  const outputPriceInput = el("input", { type: "text", placeholder: "$ per 1M output tokens" });
  const row4 = el("div", { class: "row" }, [inputPriceInput, outputPriceInput]);

  const row5 = el("div", { class: "row" }, [
    el("button", { class: "primary", text: "Save", onclick: () => {
      if (!nameInput.value || !urlInput.value) return showToast("Fill in name and base URL", true);
      if (!modelCheckboxContainer.checkboxes || !modelCheckboxContainer.checkboxes.size) {
        return showToast("Click 'Scan models' first, then enable at least one model", true);
      }
      const throttle = parseThrottle(throttleInput);
      if (throttle === undefined) return;
      const rpmRaw = rpmInput.value.trim();
      const rpmVal = rpmRaw ? Number(rpmRaw) : null;
      if (rpmVal !== null && (!Number.isInteger(rpmVal) || rpmVal < 1)) {
        showToast("RPM limit must be a positive integer (or blank for unlimited)", true);
        return;
      }
      const hasPricing = inputPriceInput.value || outputPriceInput.value;
      const pricing = hasPricing ? { inputPerMillion: Number(inputPriceInput.value) || 0, outputPerMillion: Number(outputPriceInput.value) || 0 } : null;
      const models = readModelCheckboxes(modelCheckboxContainer, pricing);
      if (!models.length) return showToast("Enable at least one model", true);
      reloadAfter(api(`/admin/api/providers/${encodeURIComponent(nameInput.value)}`, {
        method: "PUT",
        body: {
          baseUrl: urlInput.value,
          costType: costTypeSelect.value,
          models,
          apiKey: keyInput.value || undefined,
          maxConcurrent: throttle,
          rpmLimit: rpmVal,
          priority: prioritySelect.value,
        },
      }), "Provider saved");
    }}),
  ]);
  section.appendChild(row0);
  section.appendChild(row1);
  section.appendChild(row2);
  section.appendChild(rowModels);
  section.appendChild(rowThrottle);
  section.appendChild(rowPriority);
  section.appendChild(rowProbe);
  section.appendChild(modelsHint);
  section.appendChild(row4);
  section.appendChild(row5);

  return section;
}

// -- Global services (memory curator, permission classifier, embeddings) --
//
// Each global service is an AgentDef with kind="global" and a built-in
// systemRole. The same provider dropdown used for project agents shows
// up here so the model/provider choice is answered from one place. The
// embeddings row has one extra `embeddingBaseUrl` field — Ollama exposes
// /api/embeddings on a different path than the OpenAI-compat chat one,
// and someone pointing a custom Ollama host at the embeddings agent
// needs that override to surface in the UI.
function renderGlobalServicesPanel(providers) {
  const section = el("section", { class: "panel" });
  section.appendChild(el("h2", { text: "Global services" }));
  section.appendChild(el("p", { class: "desc", text: "Project-orthogonal services the gateway runs in the background: memory curator (extracts facts from sessions), permission classifier (gates tool calls), embeddings (powers memory search). " }));

  const agents = (state.globalAgents || []).slice();
  if (!agents.length) {
    section.appendChild(el("p", { class: "small", text: "No global agents configured. Restart the gateway to seed the defaults." }));
    return section;
  }

  // Stable display order so the curator sits next to its closest consumer
  // (memory search), and embeddings — which already runs in
  // /admin/api/state — stays at the bottom by convention.
  const order = ["memoryCurator", "permissionClassifier", "embeddings"];
  agents.sort((a, b) => order.indexOf(a.systemRole || "") - order.indexOf(b.systemRole || ""));

  const table = el("table", { class: "providers-table" });
  table.appendChild(el("colgroup", {}, [
    el("col", { style: "width: 22%;" }),
    el("col", { style: "width: 28%;" }),
    el("col", { style: "width: 22%;" }),
    el("col", { style: "width: 18%;" }),
    el("col", { style: "width: 10%;" }),
  ]));
  table.appendChild(el("tr", {}, [
    el("th", { text: "Service" }),
    el("th", { text: "Provider" }),
    el("th", { text: "Model" }),
    el("th", { text: "Endpoint" }),
    el("th", { text: "Actions" }),
  ]));

  for (const agent of agents) {
    const providerOptions = ["anthropic", ...Object.keys(providers || {})];
    const providerSelect = el("select", {});
    for (const key of providerOptions) {
      const opt = el("option", { value: key, text: key });
      if (key === agent.providerKey) opt.setAttribute("selected", "selected");
      providerSelect.appendChild(opt);
    }
    const modelInput = el("input", { type: "text", value: agent.model, placeholder: "model name" });
    const endpointInput = el("input", {
      type: "text",
      value: agent.embeddingBaseUrl || "",
      placeholder: agent.systemRole === "embeddings" ? "default: derived from provider host" : "(only for embeddings)",
      disabled: agent.systemRole !== "embeddings" ? "disabled" : undefined,
    });
    const saveBtn = el("button", { class: "row-btn primary", text: "Save", onclick: () => {
      const patch = {
        providerKey: providerSelect.value,
        model: modelInput.value,
        embeddingBaseUrl: agent.systemRole === "embeddings" ? (endpointInput.value || null) : undefined,
      };
      reloadAfter(api(`/admin/api/global-agents/${encodeURIComponent(agent.systemRole)}`, {
        method: "PATCH",
        body: patch,
      }), `${labelForRole(agent.systemRole)} updated`);
    }});
    const row = el("tr", {}, [
      el("td", {}, [
        el("strong", { text: labelForRole(agent.systemRole) }),
        el("br"),
        el("span", { class: "small", text: agent.name }),
      ]),
      el("td", {}, [providerSelect]),
      el("td", {}, [modelInput]),
      el("td", { class: "url-cell" }, [
        endpointInput,
      ]),
      el("td", { class: "actions-cell" }, [saveBtn]),
    ]);
    table.appendChild(row);
  }
  section.appendChild(table);
  section.appendChild(el("p", { class: "small", style: "margin-top: 8px;", text: "The endpoint field is only meaningful for embeddings — Ollama exposes them at a different path than /v1/chat/completions, so the runtime either derives the URL from the named provider or uses the explicit host here." }));
  return section;
}

function labelForRole(systemRole) {
  switch (systemRole) {
    case "memoryCurator": return "Memory curator";
    case "permissionClassifier": return "Permission classifier";
    case "embeddings": return "Embeddings";
    default: return systemRole || "(unknown)";
  }
}

// -- Projects / remote control ----------------------------------------

function renderProjectsPanel() {
  const section = el("section", { class: "panel" });
  section.appendChild(el("h2", { text: "Projects" }));
  section.appendChild(el("p", { class: "desc", text: "Each project is a workspace folder. A chat is a connectable session for that workspace -- open it from your phone, another computer, or the Custos desktop app to stream turns against the project's folder. The connect link is a bearer credential: anyone with it can type into that session. Don't share it, and don't expose this port past a network you trust." }));

  // New project button
  section.appendChild(el("div", { class: "row" }, [
    el("button", { class: "primary", text: "New project", onclick: async () => {
      const name = prompt("Project name:");
      if (!name || !name.trim()) return;
      reloadAfter(api("/admin/api/projects", { method: "POST", body: { name: name.trim() } }), "Project created");
    }}),
  ]));

  const projects = state.projects || [];
  if (projects.length === 0) {
    section.appendChild(el("p", { class: "small", text: "No projects yet." }));
  } else {
    const table = el("table", { style: "table-layout: fixed;" });
    const colgroup = el("colgroup", {}, [
      el("col", { style: "width: 28%;" }),
      el("col", { style: "width: 26%;" }),
      el("col", { style: "width: 46%;" }),
    ]);
    table.appendChild(colgroup);

    // Compact header
    const thead = el("thead", {});
    thead.appendChild(el("tr", {}, [
      el("th", { text: "Project" }),
      el("th", { text: "Budget" }),
      el("th", { text: "Agents · Controls" }),
    ]));
    table.appendChild(thead);

    const tbody = el("tbody", {});

    for (const project of projects) {
      const tr = el("tr", {});
      const id = project.id;

      // --- Column 1: Name + workspace + chat toggle ---
      const nameCell = el("td", { style: "vertical-align: top;" });
      nameCell.appendChild(el("strong", { text: project.name }));
      nameCell.appendChild(el("br"));
      nameCell.appendChild(el("span", { class: "small", text: project.workspaceDir }));

      // Lazy-load toggle: fetches chats on first click, toggles detail row after.
      const chatToggle = el("span", {
        class: "small",
        style: "cursor: pointer; color: var(--accent); margin-left: 4px;",
        text: `► Chats`,
        onclick: async (ev) => {
          ev.stopPropagation();
          let detailRow = tr.nextElementSibling;
          if (!detailRow || !detailRow.classList.contains("chat-detail")) {
            // First click — fetch chats and build the detail row.
            chatToggle.textContent = "► Loading…";
            let chats;
            try {
              const resp = await api(`/admin/api/projects/${project.id}/chats`);
              chats = resp.chats || [];
            } catch {
              chats = [];
            }
            detailRow = el("tr", { class: "chat-detail" });
            const detailTd = el("td", { colspan: "3", style: "padding: 0; border: none;" });
            const chatWrap = el("div", { style: "margin: 0 0 8px 0; display: flex; flex-direction: column; gap: 4px;" });
            for (const chat of chats) {
              chatWrap.appendChild(renderChat(chat));
            }
            detailTd.appendChild(chatWrap);
            detailRow.appendChild(detailTd);
            tr.parentNode.insertBefore(detailRow, tr.nextSibling);
          }
          const hidden = detailRow.style.display === "none";
          detailRow.style.display = hidden ? "" : "none";
          chatToggle.textContent = hidden ? "▲ Chats" : "► Chats";
        },
      });
      nameCell.appendChild(chatToggle);
      tr.appendChild(nameCell);

      // --- Column 2: Budget bar (compact inline) ---
      const budgetCell = el("td", { style: "vertical-align: middle;" });
      const budget = project.budget;
      if (budget && budget.monthlyUsd != null) {
        const limit = budget.monthlyUsd;
        const spent = project.spentUsd ?? 0;
        const pct = Math.min(100, Math.round((spent / limit) * 100));
        let cls = "ok";
        if (pct >= 90) cls = "danger";
        else if (pct >= 70) cls = "warn";
        const now = new Date();
        const resetDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 1));
        const resetStr = resetDate.toLocaleDateString(undefined, { month: "short", day: "numeric" });

        budgetCell.appendChild(el("div", { style: "display: flex; align-items: center; gap: 6px;" }, [
          el("span", { class: "budget-label", text: `$${spent.toFixed(0)}` }),
          el("div", { style: "flex: 1; background: var(--bg); border-radius: 999px; height: 6px; overflow: hidden; min-width: 60px;" }, [
            el("div", { class: `budget-bar-fill ${cls}`, style: `width: ${Math.max(2, pct)}%; height: 100%; border-radius: 999px;` }),
          ]),
          el("span", { class: "budget-label", text: `$${limit.toFixed(0)}` }),
          el("span", { class: "small", text: `↻${resetStr}` }),
        ]));
      } else {
        budgetCell.appendChild(el("span", { class: "small", text: "—" }));
      }
      tr.appendChild(budgetCell);

      // --- Column 3: Agent badges + action buttons ---
      const controlsCell = el("td", { style: "vertical-align: middle;" });

      // Agent roster (compact inline badges)
      const roster = project.agents || [];
      const roleLabels = { "product-owner": "PO", "engineering-manager": "EM", engineer: "Eng", qa: "QA", devops: "DevOps" };
      const roleOrder = ["product-owner", "engineering-manager", "engineer", "qa", "devops"];
      const byRole = new Map(roster.filter((a) => roleOrder.includes(a.role)).map((a) => [a.role, a]));
      const shown = roleOrder.map((r) => byRole.get(r)).filter(Boolean);

      if (shown.length || project.pmLastRunAt) {
        const badgesRow = el("div", { style: "display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 6px; align-items: center;" });
        for (const agent of shown) {
          // Compact badge: just providerKey/model, no role label (shown by position)
          // Build a tooltip with the full providerKey/model, specialty, and QA stats.
          const tooltipLines = [`${agent.providerKey}/${agent.model}`];
          if (agent.specialty) tooltipLines.push(`Specialty: ${agent.specialty}`);
          const { assigned, completed, qaRejections } = agent.stats || {};
          const statsParts = [];
          if (assigned != null) statsParts.push(`Assigned: ${assigned}`);
          if (completed != null) statsParts.push(`Done: ${completed}`);
          if (qaRejections != null) statsParts.push(`QA ✘: ${qaRejections}`);
          if (statsParts.length) tooltipLines.push(statsParts.join(" | "));
          if (agent.notes?.length) {
            const lastNote = agent.notes[agent.notes.length - 1];
            tooltipLines.push(`Last note: ${lastNote.length > 80 ? lastNote.slice(0, 80) + "..." : lastNote}`);
          }
          badgesRow.appendChild(el("span", {
            class: `badge ${agent.role === "engineer" ? "warn" : "ok"}`,
            style: "font-size: 10px; padding: 1px 5px; cursor: help;",
            title: tooltipLines.join("\n"),
            text: `${roleLabels[agent.role]}:${agent.model.includes("/") ? agent.model.split("/").pop() : agent.model}`,
          }));
        }
        if (project.pmLastRunAt) {
          const pmDate = new Date(project.pmLastRunAt);
          badgesRow.appendChild(el("span", { class: "small", style: "font-size: 10px;", text: `${pmDate.toLocaleDateString()} ${pmDate.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}` }));
        }
        controlsCell.appendChild(badgesRow);
      }

      // Action buttons row
      const actions = el("div", { style: "display: flex; flex-wrap: wrap; gap: 4px; align-items: center;" });
      actions.appendChild(el("button", { style: "font-size: 11px; padding: 3px 8px;", text: "Chat", onclick: () => reloadAfter(
        api(`/admin/api/projects/${project.id}/chats`, { method: "POST", body: {} }), "Chat started"
      )}));
      actions.appendChild(el("button", { style: "font-size: 11px; padding: 3px 8px;", text: "Rename", onclick: () => {
        const name = prompt("Project name:", project.name);
        if (!name || !name.trim() || name.trim() === project.name) return;
        reloadAfter(api(`/admin/api/projects/${project.id}`, { method: "PATCH", body: { name: name.trim() } }), "Renamed");
      }}));
      if (project.paused) {
        actions.appendChild(el("button", { class: "primary", style: "font-size: 11px; padding: 3px 8px;", text: "Resume", onclick: () => reloadAfter(
          api(`/admin/api/projects/${project.id}/resume`, { method: "POST" }), "Project resumed"
        )}));
      } else {
        actions.appendChild(el("button", { style: "font-size: 11px; padding: 3px 8px;", text: "Pause", onclick: () => reloadAfter(
          api(`/admin/api/projects/${project.id}/pause`, { method: "POST" }), "Project paused"
        )}));
      }
      actions.appendChild(el("button", { style: "font-size: 11px; padding: 3px 8px;", text: "Re-assign", onclick: () => reloadAfter(
        api(`/admin/api/projects/${project.id}/reassign-models`, { method: "POST" }), "Project Manager re-assigning models"
      )}));
      actions.appendChild(el("button", { class: "danger", style: "font-size: 11px; padding: 3px 8px;", text: "Delete", onclick: () => {
        if (!confirm(`Delete "${project.name}"? This stops and removes all its chats -- the workspace folder and its files are left untouched.`)) return;
        reloadAfter(api(`/admin/api/projects/${project.id}`, { method: "DELETE" }), "Project deleted");
      }}));
      controlsCell.appendChild(actions);

      tr.appendChild(controlsCell);
      tbody.appendChild(tr);

    }

    table.appendChild(tbody);
    section.appendChild(table);
  }

  return section;
}

function renderChat(chat) {
  const row = el("div", { style: "display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;" });
  row.appendChild(el("span", { style: "font-size: 12px; min-width: 80px;", text: chat.title }));
  row.appendChild(el("span", { class: `badge ${chat.active ? "ok" : "off"}`, style: "font-size: 10px; padding: 1px 6px;", text: chat.active ? `Active` : "Stopped" }));

  if (chat.active) {
    const urlInput = el("input", { type: "text", style: "flex: 1; font-size: 11px; padding: 3px 6px; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 4px;", value: chat.connectUrl, readonly: "readonly" });
    row.appendChild(urlInput);
    row.appendChild(el("button", { style: "font-size: 11px; padding: 2px 6px;", text: "Copy", onclick: () => { navigator.clipboard.writeText(chat.connectUrl); showToast("Copied"); } }));
    row.appendChild(el("button", { style: "font-size: 11px; padding: 2px 6px;", text: "Open", onclick: () => window.open(chat.connectUrl, "_blank") }));
    row.appendChild(el("button", { style: "font-size: 11px; padding: 2px 6px; color: var(--danger);", text: "Stop", onclick: () => reloadAfter(
      api(`/admin/api/chats/${chat.id}/stop`, { method: "POST" }), "Chat stopped"
    )}));
  } else {
    row.appendChild(el("button", { class: "primary", style: "font-size: 11px; padding: 2px 6px;", text: "Reopen", onclick: () => reloadAfter(
      api(`/admin/api/chats/${chat.id}/reopen`, { method: "POST" }), "Chat reopened"
    )}));
    row.appendChild(el("button", { style: "font-size: 11px; padding: 2px 6px; color: var(--danger);", text: "Delete", onclick: () => {
      if (!confirm(`Delete chat "${chat.title}"?`)) return;
      reloadAfter(api(`/admin/api/chats/${chat.id}`, { method: "DELETE" }), "Chat deleted");
    }}));
  }
  return row;
}

// -- Security --------------------------------------------------

function renderSecurityPanel() {
  const section = el("section", { class: "panel" });
  section.appendChild(el("h2", { text: "Security" }));
  section.appendChild(el("p", { class: "desc", text: "Change the admin password used to sign in here and access remote control." }));

  const current = el("input", { type: "password", placeholder: "Current password" });
  const next = el("input", { type: "password", placeholder: "New password (min 8 chars)" });
  section.appendChild(el("div", { class: "row" }, [current, next, el("button", { class: "primary", text: "Change password", onclick: () => {
    if (!current.value || !next.value) return showToast("Fill in both fields", true);
    reloadAfter(api("/admin/api/change-password", { method: "POST", body: { currentPassword: current.value, newPassword: next.value } }), "Password changed");
  }})]));

  return section;
}

loadState().catch((err) => {
  $("#app").innerHTML = "";
  $("#app").appendChild(el("section", { class: "panel" }, [el("p", { text: "Failed to load: " + err.message })]));
});
</script>
</body>
