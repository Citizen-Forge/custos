<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Custos Admin</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1c1f26;
    --border: #2b2f38;
    --text: #e4e6eb;
    --muted: #8b93a1;
    --accent: #5b9dd9;
    --danger: #d9705b;
    --ok: #5bd98f;
    --warn: #d9c15b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  header button { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; }
  header button:hover { color: var(--text); border-color: var(--muted); }
  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 24px 28px 80px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  section.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
  }
  section.panel h2 { margin: 0 0 4px; font-size: 15px; }
  section.panel .desc { color: var(--muted); font-size: 12.5px; margin: 0 0 16px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  label { color: var(--muted); font-size: 12.5px; min-width: 70px; }
  input[type=text], input[type=password], input[type=number], select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 9px;
    font-size: 13px;
    font-family: inherit;
  }
  input[type=text], input[type=password], input[type=number] { flex: 1; min-width: 160px; }
  /* Tighter layout when a number sits inline with a small label and a
     helper-text span on the same row -- the default `flex: 1` would
     stretch it across the full panel width and crowd out the helper. */
  .row input[type=number] { flex: 0 0 110px; min-width: 0; }
  button {
    background: #262a33;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 13px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #2f3440; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.ok { background: rgba(91,217,143,0.15); color: var(--ok); }
  .badge.warn { background: rgba(217,193,91,0.15); color: var(--warn); }
  .badge.off { background: rgba(139,147,161,0.15); color: var(--muted); }
  table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .priority-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .priority-item { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
  .priority-item .num { color: var(--muted); font-variant-numeric: tabular-nums; width: 18px; }
  .priority-item select { flex: 1; }
  .task-block { margin-bottom: 18px; }
  .task-block h3 { font-size: 13px; margin: 0 0 8px; color: var(--text); }
  pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    overflow-x: auto;
    font-size: 12.5px;
    margin: 0 0 8px;
  }
  .copy-row { display: flex; justify-content: flex-end; margin-top: -4px; margin-bottom: 12px; }
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.15s, transform 0.15s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .budget-bar {
    background: var(--bg);
    border-radius: 999px;
    height: 8px;
    overflow: hidden;
    margin: 4px 0;
    flex: 1;
    min-width: 120px;
  }
  .budget-bar-fill {
    height: 100%;
    border-radius: 999px;
    transition: width 0.3s ease;
  }
  .budget-bar-fill.ok { background: var(--ok); }
  .budget-bar-fill.warn { background: var(--warn); }
  .budget-bar-fill.danger { background: var(--danger); }
  .budget-label { font-variant-numeric: tabular-nums; font-size: 12.5px; white-space: nowrap; }
  hr.sep { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .small { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Custos</h1>
    <p>Providers, projects, and agent orchestration</p>
  </div>
  <button onclick="fetch('/logout', {method: 'POST'}).then(() => location.href = '/login')">Log out</button>
</header>
<main id="app">
  <section class="panel"><p class="small">Loading…</p></section>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (sel, el = document) => el.querySelector(sel);
const el = (tag, attrs = {}, children = []) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) if (c) node.appendChild(c);
  return node;
};

let state = null;

function showToast(message, isError = false) {
  const t = $("#toast");
  t.textContent = message;
  t.className = "toast show" + (isError ? " error" : "");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => { t.className = "toast"; }, 3000);
}

// Renders a set of model checkboxes inside `container`. `models` is an
// array of { id, owned_by?, created? } from the probe endpoint. `enabledSet`
// is a Set of model names that should be pre-checked. Each model gets a
// checkbox + label. New models (not in enabledSet) start unchecked.
// The checkboxes are stored on `container.checkboxes` as a Map<name, input>.
function renderModelCheckboxes(container, models, enabledSet) {
  container.innerHTML = "";
  container.checkboxes = new Map();
  if (!models || !models.length) {
    container.appendChild(el("div", { class: "small", text: "No models found. Enter model names manually or scan again." }));
    return;
  }
  const grid = el("div", { style: "display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0;" });
  for (const model of models) {
    const id = model.id || model;
    const checked = enabledSet.has(id);
    const label = el("label", {
      style: "display: inline-flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer;",
    });
    const cb = el("input", { type: "checkbox", checked: checked ? "checked" : undefined });
    label.appendChild(cb);
    label.appendChild(el("span", { text: id }));
    container.checkboxes.set(id, cb);
    grid.appendChild(label);
  }
  container.appendChild(grid);
}

// Reads a throttle input element. Returns:
//   - undefined when the value is invalid (toast already shown) -- caller should bail
//   - null when the field is blank (== "unlimited", wire-serialized as null)
//   - a positive integer otherwise (== "throttle on, capped at N")
// `null` on the wire maps to an omitted `maxConcurrent` on config.json, so an
// unlimited instance round-trips cleanly through saveConfig -> loadConfig.
function parseThrottle(input) {
  const raw = input.value.trim();
  const value = raw ? Number(raw) : null;
  if (value !== null && (!Number.isInteger(value) || value < 1)) {
    showToast("Max concurrent must be a positive integer (or blank for unlimited)", true);
    return undefined;
  }
  return value;
}

// Reads model checkboxes from a container rendered by renderModelCheckboxes.
// Returns an array of { name, enabled } objects for the provider PUT body.
function readModelCheckboxes(container, pricing) {
  if (!container.checkboxes || container.checkboxes.size === 0) return [];
  const models = [];
  let first = true;
  for (const [name, cb] of container.checkboxes) {
    models.push({
      name,
      enabled: cb.checked,
      ...(first && pricing ? { pricing } : {}),
    });
    first = false;
  }
  return models;
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "content-type": "application/json", ...(opts.headers || {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) {
    location.href = "/login?next=" + encodeURIComponent(location.pathname);
    return new Promise(() => {}); // never resolves -- we're navigating away
  }
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
  return json;
}

async function loadState() {
  state = await api("/admin/api/state");
  state.projects = (await api("/admin/api/projects")).projects;
  for (const project of state.projects) {
    project.chats = (await api(`/admin/api/projects/${project.id}/chats`)).chats;
    // Fetch per-project settings which include budget + spend data AND agent roster.
    const settingsResp = await api(`/admin/api/projects/${project.id}/settings`);
    project.budget = settingsResp.settings.budget;
    project.spentUsd = settingsResp.spentUsd ?? 0;
    project.subscriptionUsd = settingsResp.subscriptionUsd ?? 0;
    project.agents = settingsResp.agents ?? [];
    project.pmLastRunAt = settingsResp.settings.pmLastRunAt ?? null;
    project.paused = settingsResp.settings.paused ?? false;
  }
  state.recentConversations = (await api("/admin/api/remote/conversations")).conversations;
  render();
}

async function reloadAfter(promise, successMessage) {
  try {
    await promise;
    showToast(successMessage);
    await loadState();
  } catch (err) {
    showToast(err.message, true);
  }
}

function render() {
  const app = $("#app");
  app.innerHTML = "";
  app.appendChild(renderAnthropicPanel());
  app.appendChild(renderProvidersPanel());

  app.appendChild(renderProjectsPanel());
  app.appendChild(renderSecurityPanel());
}

// -- Anthropic -----------------------------------------------------------

function renderAnthropicPanel() {
  const { anthropic } = state;
  const section = el("section", { class: "panel" });
  section.appendChild(el("h2", { text: "Anthropic" }));
  section.appendChild(el("p", { class: "desc", text: "OAuth (your Claude subscription) or an API key. OAuth is tried first if connected." }));

  const oauthRow = el("div", { class: "row" });
  const badge = anthropic.oauth.connected
    ? el("span", { class: "badge ok", text: `Connected via ${anthropic.oauth.source === "claude-code" ? "Claude Code's session" : "Custos login"}` })
    : el("span", { class: "badge off", text: "Not connected" });
  oauthRow.appendChild(el("label", { text: "OAuth" }));
  oauthRow.appendChild(badge);
  if (anthropic.oauth.connected) {
    oauthRow.appendChild(el("button", { class: "danger", text: "Disconnect", onclick: () => reloadAfter(api("/admin/api/oauth/disconnect", { method: "POST" }), "OAuth disconnected") }));
  } else {
    oauthRow.appendChild(el("button", { class: "primary", text: "Connect via OAuth", onclick: startOAuthFlow }));
  }
  section.appendChild(oauthRow);
  section.appendChild(el("div", { id: "oauth-flow-area" }));

  section.appendChild(el("hr", { class: "sep" }));

  const keyRow = el("div", { class: "row" });
  keyRow.appendChild(el("label", { text: "API key" }));
  const keyInput = el("input", { type: "password", placeholder: anthropic.apiKeyMasked || "sk-ant-..." });
  keyRow.appendChild(keyInput);
  keyRow.appendChild(el("button", { class: "primary", text: "Save", onclick: () => {
    if (!keyInput.value) return showToast("Enter a key first", true);
    reloadAfter(api("/admin/api/anthropic-key", { method: "PUT", body: { apiKey: keyInput.value } }), "API key saved");
  }}));
  if (anthropic.apiKeySource !== "none") {
    keyRow.appendChild(el("button", { text: "Clear", onclick: () => reloadAfter(api("/admin/api/anthropic-key", { method: "PUT", body: { apiKey: null } }), "API key cleared") }));
  }
  section.appendChild(keyRow);
  const sourceNote = anthropic.apiKeySource === "env" ? "using ANTHROPIC_API_KEY from the environment" :
    anthropic.apiKeySource === "file" ? `configured (${anthropic.apiKeyMasked})` : "not configured -- used only as a fallback if OAuth is unavailable";
  section.appendChild(el("p", { class: "small", text: sourceNote }));

  return section;
}

async function startOAuthFlow() {
  const mode = confirm("Use your Claude Pro/Max subscription? Cancel to create an API key instead (Console mode).") ? "max" : "console";
  try {
    const { flowId, authorizationUrl } = await api("/admin/api/oauth/start", { method: "POST", body: { mode } });
    window.open(authorizationUrl, "_blank");
    const area = $("#oauth-flow-area");
    area.innerHTML = "";
    const row = el("div", { class: "row" });
    row.appendChild(el("label", { text: "Code" }));
    const input = el("input", { type: "text", placeholder: "paste the code#state shown on the page you just opened" });
    row.appendChild(input);
    row.appendChild(el("button", { class: "primary", text: "Complete", onclick: () => reloadAfter(
      api("/admin/api/oauth/complete", { method: "POST", body: { flowId, code: input.value } }),
      "OAuth connected"
    )}));
    area.appendChild(row);
  } catch (err) {
    showToast(err.message, true);
  }
}  // -- Model provider instances (new providers shape) ------------------

function providerModelList(prov) {
  // Return comma-separated enabled model names, with a count of total.
  const enabled = (prov.models || []).filter(m => m.enabled).map(m => m.name);
  const total = (prov.models || []).length;
  if (!enabled.length) return "—";
  const label = enabled.join(", ");
  return total > enabled.length ? `${label} (+${total - enabled.length} disabled)` : label;
}

function enterEditRow(row, name, prov) {
  const wrapper = el("td", { colspan: "9" });
  const form = el("div");

  const urlInput = el("input", { type: "text", value: prov.baseUrl });
  const keyInput = el("input", { type: "password", placeholder: prov.apiKeyConfigured ? "(set -- enter to replace)" : "API key (blank = none)" });

  // --- Cost type selector ---
  const costTypeSelect = el("select", {}, [
    el("option", { value: "free", text: "Free" }),
    el("option", { value: "subscription", text: "Subscription" }),
    el("option", { value: "metered", text: "Metered (pay per token)" }),
  ]);
  costTypeSelect.value = prov.costType || "free";

  // --- Model checkboxes ---
  const modelCheckboxContainer = el("div", {});
  const enabledSet = new Set((prov.models || []).filter(m => m.enabled).map(m => m.name));
  const allModelNames = (prov.models || []).map(m => m.name);
  renderModelCheckboxes(modelCheckboxContainer, allModelNames.map(name => ({ id: name })), enabledSet);
  const modelsHint = el("div", { class: "small", text: `Currently ${(prov.models || []).length} model(s).` });

  // --- Re-scan button for edit form ---
  const rescanBtn = el("button", { text: "Re-scan models", onclick: async () => {
    rescanBtn.disabled = true;
    rescanBtn.textContent = "Scanning...";
    try {
      const result = await api("/admin/api/instances/probe-models", { method: "POST", body: { baseUrl: urlInput.value, apiKey: keyInput.value || undefined } });
      const discovered = result.models || [];
      const currentEnabled = new Set();
      if (modelCheckboxContainer.checkboxes) {
        for (const [name, cb] of modelCheckboxContainer.checkboxes) {
          if (cb.checked) currentEnabled.add(name);
        }
      }
      renderModelCheckboxes(modelCheckboxContainer, discovered, currentEnabled);
      modelsHint.textContent = `Found ${discovered.length} model(s). Check the ones you want enabled.`;
    } catch (err) {
      showToast(err.message, true);
    } finally {
      rescanBtn.disabled = false;
      rescanBtn.textContent = "Re-scan models";
    }
  }});

  // --- Throttle (maxConcurrent) ---
  const throttleInput = el("input", { type: "number", min: "1", step: "1", value: prov.maxConcurrent ?? "", placeholder: "Unlimited" });

  // --- RPM limit ---
  const rpmInput = el("input", { type: "number", min: "1", step: "1", value: prov.rpmLimit ?? "", placeholder: "Unlimited" });

  // --- Priority selector ---
  const prioritySelect = el("select", {}, [
    el("option", { value: "interactive", text: "Interactive" }),
    el("option", { value: "background", text: "Background" }),
  ]);
  prioritySelect.value = prov.priority ?? "interactive";

  form.appendChild(el("div", { class: "row" }, [urlInput]));
  form.appendChild(el("div", { class: "row" }, [keyInput]));
  form.appendChild(el("div", { class: "row" }, [
    el("label", { text: "Cost type" }),
    costTypeSelect,
  ]));
  form.appendChild(el("div", { class: "row" }, [
    el("label", { text: "Models" }),
    rescanBtn,
  ]));
  form.appendChild(modelCheckboxContainer);
  form.appendChild(modelsHint);
  form.appendChild(el("div", { class: "row" }, [
    el("label", { text: "Throttle" }),
    throttleInput,
    el("span", { class: "small", text: "max concurrent" }),
    el("label", { text: "RPM limit" }),
    rpmInput,
    el("span", { class: "small", text: "requests/min (set to 10 for Gemini Free)" }),
  ]));
  form.appendChild(el("div", { class: "row" }, [
    el("label", { text: "Priority" }),
    prioritySelect,
    el("span", { class: "small", text: "interactive preempts background" }),
  ]));

  form.appendChild(el("p", { class: "small", text: "Per-model pricing (for metered providers, so per-token cost can be recorded against the project budget)." }));
  const inputPriceInput = el("input", { type: "text", placeholder: "$ per 1M input tokens", value: prov.pricing ? String(prov.pricing.inputPerMillion) : "" });
  const outputPriceInput = el("input", { type: "text", placeholder: "$ per 1M output tokens", value: prov.pricing ? String(prov.pricing.outputPerMillion) : "" });
  form.appendChild(el("div", { class: "row" }, [inputPriceInput, outputPriceInput]));

  const saveBtn = el("button", { class: "primary", text: "Save" });
  const cancelBtn = el("button", { text: "Cancel" });
  form.appendChild(el("div", { class: "row" }, [saveBtn, cancelBtn]));

  wrapper.appendChild(form);
  while (row.firstChild) row.removeChild(row.firstChild);
  row.appendChild(wrapper);

  saveBtn.onclick = () => {
    const throttle = parseThrottle(throttleInput);
    if (throttle === undefined) return;
    const rpmRaw = rpmInput.value.trim();
    const rpmVal = rpmRaw ? Number(rpmRaw) : null;
    if (rpmVal !== null && (!Number.isInteger(rpmVal) || rpmVal < 1)) {
      showToast("RPM limit must be a positive integer (or blank for unlimited)", true);
      return;
    }
    const hasPricing = inputPriceInput.value || outputPriceInput.value;
    const pricing = hasPricing ? { inputPerMillion: Number(inputPriceInput.value) || 0, outputPerMillion: Number(outputPriceInput.value) || 0 } : null;
    const models = readModelCheckboxes(modelCheckboxContainer, pricing);
    if (!models.length) {
      showToast("Enable at least one model", true);
      return;
    }
    reloadAfter(api(`/admin/api/providers/${encodeURIComponent(name)}`, {
      method: "PUT",
      body: {
        baseUrl: urlInput.value,
        costType: costTypeSelect.value,
        models,
        apiKey: keyInput.value || null,
        maxConcurrent: throttle,
        rpmLimit: rpmVal,
        priority: prioritySelect.value,
      },
    }), "Provider saved");
  };
  cancelBtn.onclick = () => loadState();
}

function renderProvidersPanel() {
  const section = el("section", { class: "panel" });
  section.appendChild(el("h2", { text: "Model providers" }));
  section.appendChild(el("p", { class: "desc", text: "Any provider speaking the OpenAI chat-completions format: Ollama, OpenAI, DeepSeek, Gemini, Groq, Mistral, xAI, OpenRouter, or a custom endpoint. Each provider can serve multiple models sharing the same base URL, API key, and rate limit." }));

  const table = el("table");
  table.appendChild(el("tr", {}, [
    el("th", { text: "Name" }), el("th", { text: "Base URL" }), el("th", { text: "Models" }), el("th", { text: "Type" }), el("th", { text: "API key" }), el("th", { text: "Throttle" }), el("th", { text: "RPM" }), el("th", { text: "Priority" }), el("th", { text: "" }),
  ]));
  for (const [name, prov] of Object.entries(state.providers)) {
    const throttleText = prov.maxConcurrent == null ? "—" : String(prov.maxConcurrent);
    const rpmText = prov.rpmLimit == null ? "—" : String(prov.rpmLimit);
    const priorityText = prov.priority == null ? "—" : (prov.priority === "interactive" ? "Interactive" : "Background");
    const costLabel = { free: "Free", subscription: "Sub", metered: "Metered" }[prov.costType] || prov.costType || "?";
    const dataRow = el("tr", {}, [
      el("td", { text: name }),
      el("td", { text: prov.baseUrl }),
      el("td", { text: providerModelList(prov) }),
      el("td", { text: costLabel }),
      el("td", { text: prov.apiKeyConfigured ? prov.apiKeyMasked : "—" }),
      el("td", { text: throttleText }),
      el("td", { text: rpmText }),
      el("td", { text: priorityText }),
      el("td", {}, [
        el("button", { text: "Edit", onclick: () => enterEditRow(dataRow, name, prov) }),
        el("button", { text: "Delete", class: "danger", onclick: () => reloadAfter(
          api(`/admin/api/providers/${encodeURIComponent(name)}`, { method: "DELETE" }), `Removed "${name}"`
        )}),
      ]),
    ]);
    table.appendChild(dataRow);
  }
  section.appendChild(table);

  section.appendChild(el("hr", { class: "sep" }));
  section.appendChild(el("p", { class: "small", text: "Add or update a provider" }));

  const nameInput = el("input", { type: "text", placeholder: "name (e.g. gemini-free)" });
  const urlInput = el("input", { type: "text", placeholder: "base URL" });
  const keyInput = el("input", { type: "password", placeholder: "API key (leave blank if none)" });

  // --- Cost type selector for new providers ---
  const costTypeSelect = el("select", {}, [
    el("option", { value: "free", text: "Free (no cost, rate-limited)" }),
    el("option", { value: "subscription", text: "Subscription (flat fee)" }),
    el("option", { value: "metered", text: "Metered (pay per token)" }),
  ]);

  // --- Model checkboxes (populated by Scan) ---
  const modelCheckboxContainer = el("div", {});
  const modelsHint = el("div", { class: "small" });

  // --- Throttle (maxConcurrent) ---
  const throttleInput = el("input", { type: "number", min: "1", step: "1", placeholder: "Unlimited" });

  // --- RPM limit (new!) ---
  const rpmInput = el("input", { type: "number", min: "1", step: "1", value: "10", placeholder: "RPM limit" });
  // Auto-fill RPM to 10 for known rate-limited presets.
  function autoFillRpm(presetId) {
    if (presetId === "gemini") { rpmInput.value = "10"; }
    else if (presetId.startsWith("ollama")) { rpmInput.value = ""; }
    else { rpmInput.value = ""; }
  }

  // --- Priority selector ---
  const prioritySelect = el("select", {}, [
    el("option", { value: "interactive", text: "Interactive" }),
    el("option", { value: "background", text: "Background" }),
  ]);

  async function autoScanModels() {
    if (!urlInput.value) return;
    try {
      const result = await api("/admin/api/instances/probe-models", { method: "POST", body: { baseUrl: urlInput.value, apiKey: keyInput.value || undefined } });
      const discovered = result.models || [];
      const enableAll = new Set(discovered.map(m => m.id));
      renderModelCheckboxes(modelCheckboxContainer, discovered, enableAll);
      modelsHint.textContent = `Found ${discovered.length} model(s). Uncheck any you don't want enabled.`;
    } catch {
      // Auto-scan failed; user can click "Scan models" manually.
    }
  }

  const presetSelect = el("select", { onchange: (ev) => {
    const preset = state.providerPresets.find((p) => p.id === ev.target.value);
    if (preset && preset.id !== "custom") urlInput.value = preset.baseUrl;
    if (preset && !nameInput.value) nameInput.value = preset.id;
    autoFillRpm(preset ? preset.id : "");
    if (preset && preset.id.startsWith("ollama")) {
      throttleInput.value = "1";
      throttleInput.placeholder = "1 (Ollama preset)";
      prioritySelect.value = "background";
    } else if (preset && preset.id !== "custom") {
      throttleInput.value = "";
      throttleInput.placeholder = "Unlimited";
      prioritySelect.value = "interactive";
    }
    // Auto-scan models for known presets so models appear immediately.
    autoScanModels();
  }});
  for (const preset of state.providerPresets) {
    presetSelect.appendChild(el("option", { value: preset.id, text: preset.label }));
  }

  const row0 = el("div", { class: "row" }, [el("label", { text: "Preset" }), presetSelect]);
  const row1 = el("div", { class: "row" }, [nameInput, urlInput]);
  const row2 = el("div", { class: "row" }, [el("label", { text: "Cost" }), costTypeSelect, keyInput]);
  const rowModels = el("div", { class: "row" }, [el("label", { text: "Models" }), el("span", { class: "small", text: "Scan a provider URL to discover available models" })]);

  const rowThrottle = el("div", { class: "row" }, [
    el("label", { text: "Throttle" }),
    throttleInput,
    el("span", { class: "small", text: "max concurrent" }),
    el("label", { text: "RPM" }),
    rpmInput,
    el("span", { class: "small", text: "req/min (Gemini Free = 10, blank = unlimited)" }),
  ]);

  const rowPriority = el("div", { class: "row" }, [
    el("label", { text: "Priority" }),
    prioritySelect,
    el("span", { class: "small", text: "interactive preempts background" }),
  ]);

  const rowProbe = el("div", { class: "row" }, [
    el("button", { text: "Scan models", onclick: async () => {
      if (!urlInput.value) return showToast("Enter a base URL first", true);
      try {
        const result = await api("/admin/api/instances/probe-models", { method: "POST", body: { baseUrl: urlInput.value, apiKey: keyInput.value || undefined } });
        const discovered = result.models || [];
        // All newly discovered models start enabled.
        const enableAll = new Set(discovered.map(m => m.id));
        renderModelCheckboxes(modelCheckboxContainer, discovered, enableAll);
        modelsHint.textContent = `Found ${discovered.length} model(s). Uncheck any you don't want enabled.`;
      } catch (err) {
        modelsHint.textContent = err.message;
      }
    }}),
  ]);

  section.appendChild(el("p", { class: "small", text: "Per-model pricing (for metered providers, so per-token cost can be recorded against the project budget)." }));
  const inputPriceInput = el("input", { type: "text", placeholder: "$ per 1M input tokens" });
  const outputPriceInput = el("input", { type: "text", placeholder: "$ per 1M output tokens" });
  const row4 = el("div", { class: "row" }, [inputPriceInput, outputPriceInput]);

  const row5 = el("div", { class: "row" }, [
    el("button", { class: "primary", text: "Save", onclick: () => {
      if (!nameInput.value || !urlInput.value) return showToast("Fill in name and base URL", true);
      if (!modelCheckboxContainer.checkboxes || !modelCheckboxContainer.checkboxes.size) {
        return showToast("Click 'Scan models' first, then enable at least one model", true);
      }
      const throttle = parseThrottle(throttleInput);
      if (throttle === undefined) return;
      const rpmRaw = rpmInput.value.trim();
      const rpmVal = rpmRaw ? Number(rpmRaw) : null;
      if (rpmVal !== null && (!Number.isInteger(rpmVal) || rpmVal < 1)) {
        showToast("RPM limit must be a positive integer (or blank for unlimited)", true);
        return;
      }
      const hasPricing = inputPriceInput.value || outputPriceInput.value;
      const pricing = hasPricing ? { inputPerMillion: Number(inputPriceInput.value) || 0, outputPerMillion: Number(outputPriceInput.value) || 0 } : null;
      const models = readModelCheckboxes(modelCheckboxContainer, pricing);
      if (!models.length) return showToast("Enable at least one model", true);
      reloadAfter(api(`/admin/api/providers/${encodeURIComponent(nameInput.value)}`, {
        method: "PUT",
        body: {
          baseUrl: urlInput.value,
          costType: costTypeSelect.value,
          models,
          apiKey: keyInput.value || undefined,
          maxConcurrent: throttle,
          rpmLimit: rpmVal,
          priority: prioritySelect.value,
        },
      }), "Provider saved");
    }}),
  ]);
  section.appendChild(row0);
  section.appendChild(row1);
  section.appendChild(row2);
  section.appendChild(rowModels);
  section.appendChild(rowThrottle);
  section.appendChild(rowPriority);
  section.appendChild(rowProbe);
  section.appendChild(modelsHint);
  section.appendChild(row4);
  section.appendChild(row5);

  section.appendChild(el("hr", { class: "sep" }));
  section.appendChild(el("p", { class: "small", text: `Embeddings (used for memory search) come from Ollama's native API, currently ${state.embeddingProvider.baseUrl} / ${state.embeddingProvider.model}` }));
  const embUrl = el("input", { type: "text", placeholder: "http://host:11434 (no /v1)", value: state.embeddingProvider.baseUrl });
  const embModel = el("input", { type: "text", placeholder: "embedding model", value: state.embeddingProvider.model });
  section.appendChild(el("div", { class: "row" }, [
    embUrl, embModel,
    el("button", { class: "primary", text: "Save", onclick: () => reloadAfter(
      api("/admin/api/embedding-provider", { method: "PUT", body: { baseUrl: embUrl.value, model: embModel.value } }), "Embedding provider saved"
    )}),
  ]));

  return section;
}

// -- Projects / remote control ----------------------------------------

function renderProjectsPanel() {
  const section = el("section", { class: "panel" });
  section.appendChild(el("h2", { text: "Projects" }));
  section.appendChild(el("p", { class: "desc", text: "Each project is a workspace folder. Chats run \"claude\" in a real terminal inside this container, scoped to that folder, and stream over WebSocket -- steer them from your phone, another computer, or the Custos desktop app. A chat's connect link is a bearer credential: anyone with it can type into that session. Don't share it, and don't expose this port past a network you trust." }));

  section.appendChild(el("div", { class: "row" }, [
    el("button", { class: "primary", text: "New project", onclick: async () => {
      const name = prompt("Project name:");
      if (!name || !name.trim()) return;
      reloadAfter(api("/admin/api/projects", { method: "POST", body: { name: name.trim() } }), "Project created");
    }}),
  ]));

  const projects = state.projects || [];
  if (projects.length === 0) {
    section.appendChild(el("p", { class: "small", text: "No projects yet." }));
  }

  for (const project of projects) {
    section.appendChild(el("hr", { class: "sep" }));
    section.appendChild(renderProject(project));
  }

  const conversations = state.recentConversations || [];
  if (conversations.length > 0 && projects.length > 0) {
    section.appendChild(el("hr", { class: "sep" }));
    section.appendChild(el("p", { class: "small", text: "Resume a recent conversation into a project -- Claude opens with a summary of where it left off (not a literal replay; see README)." }));
    const list = el("div", { class: "priority-list" });
    for (const conv of conversations) {
      const when = new Date(conv.lastActiveAt).toLocaleString();
      const select = el("select", {}, projects.map((p) => el("option", { value: p.id, text: p.name })));
      list.appendChild(el("div", { class: "priority-item" }, [
        el("span", { class: "small", text: `${conv.preview || "(no preview)"} -- ${when} (${conv.exchangeCount} exchanges)` }),
        select,
        el("button", { class: "primary", text: "Resume into project", onclick: () => reloadAfter(
          api(`/admin/api/projects/${select.value}/chats`, { method: "POST", body: { resumeConversationId: conv.id } }), "Chat started"
        )}),
      ]));
    }
    section.appendChild(list);
  }

  return section;
}

function renderBudgetBar(project) {
  const budget = project.budget;
  if (!budget || budget.monthlyUsd == null) return null; // Unlimited — no bar needed.

  const limit = budget.monthlyUsd;
  const spent = project.spentUsd ?? 0;
  const pct = Math.min(100, Math.round((spent / limit) * 100));

  // Determine the bar colour and label style.
  let cls = "ok";
  if (pct >= 90) cls = "danger";
  else if (pct >= 70) cls = "warn";

  // Compute the monthly reset date (1st of next month).
  const now = new Date();
  const resetDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 1));
  const resetStr = resetDate.toLocaleDateString(undefined, { month: "short", day: "numeric" });

  const container = el("div", { style: "display: flex; align-items: center; gap: 10px; margin: 8px 0;" });
  container.appendChild(el("span", { class: "budget-label", text: `$${spent.toFixed(2)}` }));

  const barOuter = el("div", { class: "budget-bar" });
  const barFill = el("div", { class: `budget-bar-fill ${cls}`, style: `width: ${Math.max(2, pct)}%;` });
  barOuter.appendChild(barFill);
  container.appendChild(barOuter);

  container.appendChild(el("span", { class: "budget-label", text: `$${limit.toFixed(2)}` }));
  container.appendChild(el("span", { class: "small", text: `resets ${resetStr}` }));

  return container;
}

function renderProject(project) {
  const wrap = el("div", {});
  wrap.appendChild(el("div", { class: "row" }, [
    el("strong", { text: project.name }),
    el("span", { class: "small", text: project.workspaceDir }),
  ]));

  // Budget bar (only when a monthly cap is configured).
  const budgetBar = renderBudgetBar(project);
  if (budgetBar) wrap.appendChild(budgetBar);

  // Agent roster — shows provider/model per role, PM timestamp, and a
  // re-assign button so operators can see at a glance whether a recent
  // provider edit or budget cap change needs a fresh assignment pass.
  const roster = project.agents || [];
  const roleLabels = { "product-owner": "PO", "engineering-manager": "EM", engineer: "Eng", qa: "QA", devops: "DevOps", "project-manager": "PM" };
  const roleOrder = ["product-owner", "engineering-manager", "engineer", "qa", "devops"];
  // Only show the built-in roles the PM assigns, excluding the PM itself and steering.
  // Use roleOrder to guarantee deterministic display: PO, EM, Eng, QA, DevOps.
  const byRole = new Map(roster.filter((a) => roleOrder.includes(a.role)).map((a) => [a.role, a]));
  const shown = roleOrder.map((r) => byRole.get(r)).filter(Boolean);
  if (shown.length) {
    const rosterRow = el("div", { class: "row", style: "flex-wrap: wrap; gap: 4px 8px;" });
    for (const agent of shown) {
      rosterRow.appendChild(el("span", { class: `badge ${agent.role === "engineer" ? "warn" : "ok"}`, text: `${roleLabels[agent.role] || agent.role}: ${agent.providerKey}/${agent.model}` }));
    }
    // PM last-run timestamp (only shown if the PM has ever run).
    if (project.pmLastRunAt) {
      const pmDate = new Date(project.pmLastRunAt);
      rosterRow.appendChild(el("span", { class: "small", text: `PM assigned ${pmDate.toLocaleDateString()} ${pmDate.toLocaleTimeString()}` }));
    }
    wrap.appendChild(rosterRow);
  }

  wrap.appendChild(el("div", { class: "row" }, [
    el("button", { text: "New chat", onclick: () => reloadAfter(
      api(`/admin/api/projects/${project.id}/chats`, { method: "POST", body: {} }), "Chat started"
    )}),
    el("button", { text: "Rename", onclick: () => {
      const name = prompt("Project name:", project.name);
      if (!name || !name.trim() || name.trim() === project.name) return;
      reloadAfter(api(`/admin/api/projects/${project.id}`, { method: "PATCH", body: { name: name.trim() } }), "Renamed");
    }}),
    el("span", { style: "flex: 1;" }), // spacer
    project.paused
      ? el("button", { class: "primary", text: "Resume", onclick: () => reloadAfter(
          api(`/admin/api/projects/${project.id}/resume`, { method: "POST" }), "Project resumed"
        )})
      : el("button", { text: "Pause", onclick: () => reloadAfter(
          api(`/admin/api/projects/${project.id}/pause`, { method: "POST" }), "Project paused"
        )}),
    el("button", { text: "Re-assign models", onclick: () => reloadAfter(
      api(`/admin/api/projects/${project.id}/reassign-models`, { method: "POST" }), "Project Manager re-assigning models"
    )}),
    el("button", { class: "danger", text: "Delete project", onclick: () => {
      if (!confirm(`Delete "${project.name}"? This stops and removes all its chats -- the workspace folder and its files are left untouched.`)) return;
      reloadAfter(api(`/admin/api/projects/${project.id}`, { method: "DELETE" }), "Project deleted");
    }}),
  ]));

  const chats = project.chats || [];
  if (chats.length === 0) {
    wrap.appendChild(el("p", { class: "small", text: "No chats yet." }));
  } else {
    const list = el("div", { class: "priority-list" });
    for (const chat of chats) {
      list.appendChild(renderChat(chat));
    }
    wrap.appendChild(list);
  }
  return wrap;
}

function renderChat(chat) {
  const row = el("div", { class: "priority-item" });
  row.appendChild(el("span", { class: "small", text: chat.title }));
  row.appendChild(el("span", { class: `badge ${chat.active ? "ok" : "off"}`, text: chat.active ? `Active -- ${chat.connectedClients} connected` : "Stopped" }));

  if (chat.active) {
    const urlInput = el("input", { type: "text", value: chat.connectUrl });
    urlInput.readOnly = true;
    row.appendChild(urlInput);
    row.appendChild(el("button", { text: "Copy link", onclick: () => { navigator.clipboard.writeText(chat.connectUrl); showToast("Copied"); } }));
    row.appendChild(el("button", { text: "Open", onclick: () => window.open(chat.connectUrl, "_blank") }));
    row.appendChild(el("button", { class: "danger", text: "Stop", onclick: () => reloadAfter(
      api(`/admin/api/chats/${chat.id}/stop`, { method: "POST" }), "Chat stopped"
    )}));
  } else {
    row.appendChild(el("button", { class: "primary", text: "Reopen", onclick: () => reloadAfter(
      api(`/admin/api/chats/${chat.id}/reopen`, { method: "POST" }), "Chat reopened"
    )}));
    row.appendChild(el("button", { class: "danger", text: "Delete", onclick: () => {
      if (!confirm(`Delete chat "${chat.title}"?`)) return;
      reloadAfter(api(`/admin/api/chats/${chat.id}`, { method: "DELETE" }), "Chat deleted");
    }}));
  }
  return row;
}

// -- Security --------------------------------------------------

function renderSecurityPanel() {
  const section = el("section", { class: "panel" });
  section.appendChild(el("h2", { text: "Security" }));
  section.appendChild(el("p", { class: "desc", text: "Change the admin password used to sign in here and access remote control." }));

  const current = el("input", { type: "password", placeholder: "Current password" });
  const next = el("input", { type: "password", placeholder: "New password (min 8 chars)" });
  section.appendChild(el("div", { class: "row" }, [current, next, el("button", { class: "primary", text: "Change password", onclick: () => {
    if (!current.value || !next.value) return showToast("Fill in both fields", true);
    reloadAfter(api("/admin/api/change-password", { method: "POST", body: { currentPassword: current.value, newPassword: next.value } }), "Password changed");
  }})]));

  section.appendChild(el("hr", { class: "sep" }));
  section.appendChild(el("p", { class: "small", text: "Client API key -- required on every /v1/messages, /hooks/*, and /memory/search request, sent as the x-api-key header (the same header Claude Code already sends for real Anthropic API keys -- Custos checks this instead of forwarding it anywhere). Fails closed: until you generate one, those endpoints reject everything. Set the same value as ANTHROPIC_API_KEY on any Claude Code install pointed at this proxy." }));

  if (state.clientApiKey) {
    const keyRow = el("div", { class: "row" });
    const keyInput = el("input", { type: "text", value: state.clientApiKey });
    keyInput.readOnly = true;
    keyRow.appendChild(keyInput);
    keyRow.appendChild(el("button", { text: "Copy", onclick: () => { navigator.clipboard.writeText(state.clientApiKey); showToast("Copied"); } }));
    section.appendChild(keyRow);
    section.appendChild(el("div", { class: "row" }, [
      el("span", { class: "badge ok", text: "Enforced" }),
      el("button", { text: "Regenerate", onclick: () => {
        if (!confirm("This invalidates the current key immediately -- any Claude Code install still using the old one will start getting 401s until you update it. Continue?")) return;
        reloadAfter(api("/admin/api/client-key/generate", { method: "POST" }), "New key generated");
      }}),
      el("button", { class: "danger", text: "Clear key (blocks all proxy traffic)", onclick: () => {
        if (!confirm("This immediately blocks /v1/messages, /hooks/*, and /memory/search for everyone, including your own Claude Code installs, until you generate a new key. Continue?")) return;
        reloadAfter(api("/admin/api/client-key/clear", { method: "POST" }), "Key cleared -- proxy traffic now blocked");
      }}),
    ]));
  } else {
    section.appendChild(el("div", { class: "row" }, [
      el("span", { class: "badge off", text: "Not set -- all proxy traffic is blocked" }),
      el("button", { class: "primary", text: "Generate key", onclick: () => reloadAfter(api("/admin/api/client-key/generate", { method: "POST" }), "Key generated") }),
    ]));
  }

  return section;
}

loadState().catch((err) => {
  $("#app").innerHTML = "";
  $("#app").appendChild(el("section", { class: "panel" }, [el("p", { text: "Failed to load: " + err.message })]));
});
</script>
</body>
