services:
  gateway:
    # CI pushes `:main` on every push to main; `docker compose pull gateway
    # && docker compose up -d --no-deps gateway` keeps consumers current
    # with the rolling tag (see .github/workflows/docker-image.yml). For
    # in-place development instead, swap this for `build: .`.
    image: ghcr.io/citizen-forge/custos:main
    ports:
      - "8787:8787"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # The externally-reachable URL for this instance (behind a reverse
      # proxy/tunnel) -- used to build the ANTHROPIC_BASE_URL/settings.json
      # snippet correctly and to enable secure cookies. Leave unset for a
      # plain local/LAN deployment.
      - GATEWAY_PUBLIC_URL=${GATEWAY_PUBLIC_URL:-}
    volumes:
      - ./data:/app/data
      # The directory a remote-control session actually operates in --
      # point CUSTOS_WORKSPACE at whatever project(s) you want reachable
      # remotely. Defaults to an empty local ./workspace so this works
      # out of the box without editing anything.
      # Point CUSTOS_WORKSPACE at a directory that contains ONLY the projects
      # Custos should be able to touch -- it is the entire filesystem as far
      # as an autonomous agent is concerned. Pointing it at a broad share
      # gives every engineer agent write access to all of it.
      - ${CUSTOS_WORKSPACE:-./workspace}:/workspace
      # Claude Code's backing state for the spawned subprocesses the
      # orchestrator runs: session transcripts (the data `--resume` reads
      # from), the settings file Custos writes hook entries into, and the
      # synced credentials it injects into each one. Without this mount the
      # state lives in the container's writable layer and is destroyed on
      # every rebuild -- which silently breaks `--resume`, so reopening a
      # chat starts a brand-new conversation instead of continuing the old
      # one. Owned end-to-end by Custos, named after Claude Code only
      # because that's the upstream tool whose binary reads from it.
      - ./data/claude-home:/root/.claude
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant-storage:
