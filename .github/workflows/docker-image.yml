# Builds and pushes the Custos Docker image to ghcr.io.
#
# Runner strategy:
#   - PRs (validate): GHA-managed ubuntu-latest. Fork PRs NEVER run on
#     self-hosted runners (GitHub's secret-exfiltration guard); running
#     them through `pull_request` on ubuntu-latest is the safe path.
#   - Pushes (publish): self-hosted runner on the Unraid box. Docker.io
#     round-trips stay on the LAN, the GHA ubuntu NAT flake stops
#     mattering, and the GHA cache API isn't needed -- the host-level
#     buildx cache at /tmp/custos-build-cache keeps pushes warm.
#
# Free-hosting rationale: GHCR is free for public GitHub repos with
# unlimited storage and bandwidth. Docker Hub's free tier rate-limits
# unauthenticated pulls to 100 per 6 hours, which breaks Unraid's
# anonymous `docker compose pull` flow. ECR / Quay would also work but
# require extra accounts and credential plumbing.
#
# Persistence after Unraid reboot: the bootstrap script
# (scripts/register-self-hosted-runner.sh) wires a /boot/config/go
# block so the runner re-installs and re-starts on every Unraid boot.
# Unraid's /etc is RAM-backed and wipes on reboot; /boot/config is on
# flash and survives.

name: docker-image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs in flight when a new commit lands on the same ref --
# saves minutes on the GHA-hosted validate job and avoids overlapping
# cache writes on the self-hosted publish job.
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

# contents:read for checkout; packages:write for ghcr.io push (publish
# job only -- validate never logs in, since fork PRs reach this step
# with packages:write stripped).
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ---- validate --------------------------------------------------------
  # PR-only build that parses the Dockerfile + base-image pull path.
  # Fork PRs NEVER trigger this self-hosted branch, by GHA design. The
  # build pushes nothing, so missing tokens are safe to ignore.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set IMAGE_NAME
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # The first push (140a92e) failed inside Set up Docker Buildx with
      # `Get https://registry-1.docker.io/v2/: context deadline exceeded`.
      # Same guard on ubuntu-latest PR builds keeps both runners on the
      # same Docker Hub mirror, so what passes validate is what publish
      # will see.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."docker.io"]
              mirrors = ["https://mirror.gcr.io"]

      - name: Build (dry run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          # Cache divergence vs the publish job is intentional: PRs
          # validate on ubuntu-latest where the GHA cache API is
          # reachable, so `type=gha` warms PR builds. The publish job
          # runs on the Unraid self-hosted runner where `type=gha` is
          # unreachable; it uses `type=local` against the runner's host
          # filesystem (see publish job's Build and Push step).
          cache-from: type=gha,scope=${{ github.ref }}

  # ---- publish --------------------------------------------------------
  # Push-to-main only. Runs on the Unraid self-hosted runner via label
  # `custos`. Local buildx cache (`/tmp/custos-build-cache`) replaces
  # the GHA cache API (which only works on GHA-managed ubuntu). The CI
  # is now fully on the deploy target's LAN.
  publish:
    if: github.event_name == 'push'
    runs-on: [self-hosted, custos, linux, x64]
    steps:
      - uses: actions/checkout@v4

      # Same lowercase + unset guard as the validate job's step. The
      # defensive `GITHUB_REPOSITORY` check is meaningful here -- a
      # misconfigured self-hosted runner might not receive github's
      # automatic env injection.
      - name: Set IMAGE_NAME
        run: |
          if [ -z "$GITHUB_REPOSITORY" ]; then
            echo "::error::GITHUB_REPOSITORY is unset; required for this workflow"
            exit 1
          fi
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."docker.io"]
              mirrors = ["https://mirror.gcr.io"]

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # :main is the rolling channel Unraid pulls.
          # :sha-<short> is the immutable per-commit tag for rollbacks.
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=${{ github.repository }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ env.SHORT_SHA }}
          # `type=local` writes buildx's compressed cache to a path on the
          # self-hosted runner's filesystem. `mode=max` keeps all layers
          # (no GC). First push is cold (no cache dir exists yet);
          # subsequent pushes reuse the prior tree.
          cache-from: type=local,src=/tmp/custos-build-cache
          cache-to: type=local,dest=/tmp/custos-build-cache,mode=max
          provenance: true
