# Mints a short-lived registration token for the self-hosted runner
# bootstrap (scripts/register-self-hosted-runner.sh).
#
# Trigger: workflow_dispatch. Manual only -- this never runs on push or
# PR. The token is ~1h-scoped and re-mintable, so on-demand is correct.
#
# Scopes: administration:write is the documented scope for minting
# registration tokens for self-hosted runners in a repo. It is not
# granted by default; the workflow-level `permissions:` block is what
# grants it (not the repo's default GITHUB_TOKEN, which is read-only).
#
# Output: $GITHUB_STEP_SUMMARY renders the token in the run's job
# summary. The `::add-mask::` ensures the value is hidden in plain log
# output beyond STEP_SUMMARY. The user copies the token out of the UI
# and pastes it into RUNNER_TOKEN env on Unraid.

name: register-runner

on:
  workflow_dispatch:
    inputs:
      requested_by:
        description: 'Identifier for the registering host (e.g., "unraid-build"). Audit-only.'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  administration: write

jobs:
  mint-token:
    runs-on: ubuntu-latest
    steps:
      - name: Mint registration token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RESP=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/runners/registration-token")
          TOKEN=$(echo "$RESP" | jq -r .token)
          EXPIRES=$(echo "$RESP" | jq -r .expires_at)
          # Register the mask BEFORE anything echoes the value -- masks any
          # downstream log lines that happen to include it.
          echo "::add-mask::${TOKEN}"
          # The user's only retrieval channel. STEP_SUMMARY is rendered in
          # the run's job-summary panel and is the canonical way to surface
          # values that the user must read off the run UI.
          {
            echo "### Runner registration token"
            echo
            echo "Token (expires at \`${EXPIRES}\`):"
            echo
            echo '```'
            echo "$TOKEN"
            echo '```'
            echo
            echo 'Paste this on the runner host, then invoke the bootstrap script:'
            echo
            echo '```sh'
            echo "export RUNNER_TOKEN='$TOKEN'"
            echo 'curl -fsSL https://raw.githubusercontent.com/Citizen-Forge/custos/main/scripts/register-self-hosted-runner.sh | bash'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
